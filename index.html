<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="管床">
<meta name="theme-color" content="#0a6e5c">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>管床</title>
<style>
:root{
  --c-main:#0a6e5c; --c-main-dark:#085a4b; --c-main-soft:#e3f0ed;
  --c-bg:#f4f6f5; --c-card:#ffffff; --c-line:#e8ecea;
  --c-text:#22302c; --c-sub:#7b8a85; --c-danger:#c0392b; --c-warn:#b9770e;
  --radius:14px;
  --sat: env(safe-area-inset-top); --sab: env(safe-area-inset-bottom);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  background:var(--c-bg); color:var(--c-text); font-size:16px; line-height:1.5;
  overscroll-behavior-y:none;
}
button{font-family:inherit;border:none;background:none;color:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:16px;color:var(--c-text)}

/* ---------- 锁屏 ---------- */
#lock{position:fixed;inset:0;z-index:100;background:linear-gradient(160deg,#0a6e5c,#08513f);
  display:none;flex-direction:column;align-items:center;justify-content:center;color:#fff;padding:24px}
#lock .logo{width:84px;height:84px;border-radius:22px;background:rgba(255,255,255,.15);
  display:flex;align-items:center;justify-content:center;font-size:44px;font-weight:700;margin-bottom:28px}
#lock h2{font-size:18px;font-weight:600;margin-bottom:6px}
#lock .hint{font-size:13px;opacity:.75;margin-bottom:26px}
#lock input{width:200px;text-align:center;font-size:26px;letter-spacing:10px;padding:10px 4px 10px 14px;
  border:none;border-bottom:2px solid rgba(255,255,255,.5);background:transparent;color:#fff;outline:none}
#lock input::placeholder{color:rgba(255,255,255,.4);letter-spacing:0;font-size:15px}
#lock .row{display:flex;gap:14px;margin-top:26px}
#lock .row button{padding:10px 22px;border-radius:10px;font-size:15px}
#lock .btn-ok{background:#fff;color:var(--c-main);font-weight:600}
#lock .btn-ghost{color:rgba(255,255,255,.85);border:1px solid rgba(255,255,255,.4)}
#lock .err{color:#ffd7d0;font-size:13px;height:20px;margin-top:14px}

/* ---------- 主框架 ---------- */
#app{display:none;flex-direction:column;height:100%;max-width:560px;margin:0 auto;background:var(--c-bg)}
#app.on{display:flex}
header.appbar{padding:calc(var(--sat) + 10px) 16px 10px;display:flex;align-items:center;justify-content:space-between;background:var(--c-bg);position:sticky;top:0;z-index:10}
header.appbar h1{font-size:22px;font-weight:700}
header.appbar .add{width:34px;height:34px;border-radius:50%;background:var(--c-main);color:#fff;font-size:24px;line-height:1;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(10,110,92,.35)}
main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:4px 14px 20px}
.tabbar{display:flex;background:var(--c-card);border-top:1px solid var(--c-line);
  padding-bottom:var(--sab);position:sticky;bottom:0}
.tabbar button{flex:1;padding:8px 0 6px;display:flex;flex-direction:column;align-items:center;gap:2px;
  color:var(--c-sub);font-size:11px;position:relative}
.tabbar button.on{color:var(--c-main);font-weight:600}
.tabbar svg{width:24px;height:24px}
.tabbar .bdg{position:absolute;top:4px;right:calc(50% - 20px);min-width:16px;height:16px;border-radius:8px;
  background:var(--c-danger);color:#fff;font-size:10px;line-height:16px;padding:0 4px;display:none}
.view{display:none}.view.on{display:block}

/* ---------- 通用组件 ---------- */
.card{background:var(--c-card);border-radius:var(--radius);padding:14px;margin-bottom:12px;box-shadow:0 1px 2px rgba(30,50,45,.04)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--c-main);color:#fff;
  border-radius:10px;padding:10px 18px;font-size:15px;font-weight:600}
.btn.block{width:100%;padding:13px;font-size:16px}
.btn.ghost{background:var(--c-main-soft);color:var(--c-main)}
.btn.danger{background:#fbeeeb;color:var(--c-danger)}
.btn.sm{padding:5px 12px;font-size:13px;border-radius:8px;font-weight:500}
.empty{text-align:center;color:var(--c-sub);padding:40px 20px;font-size:14px}
.empty .big{font-size:40px;margin-bottom:10px}
.sect{font-size:13px;color:var(--c-sub);margin:16px 2px 8px;display:flex;justify-content:space-between;align-items:baseline}
.sect .link{color:var(--c-main);font-size:13px}
.badge{min-width:20px;height:20px;border-radius:10px;background:var(--c-danger);color:#fff;font-size:12px;
  line-height:20px;text-align:center;padding:0 6px;font-weight:600}
.badge.gray{background:#d6dedb;color:var(--c-sub)}

/* 患者卡片 */
.pt{display:flex;align-items:center;gap:12px;padding:13px 14px}
.pt .bed{min-width:52px;text-align:center}
.pt .bed .n{font-size:21px;font-weight:800;color:var(--c-main);line-height:1.15}
.pt .bed .t{font-size:11px;color:var(--c-sub)}
.pt .mid{flex:1;min-width:0}
.pt .mid .name{font-size:17px;font-weight:700}
.pt .mid .dx{font-size:13px;color:var(--c-sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.pt .mid .note{font-size:12px;color:var(--c-warn);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.pt .mid .note:empty{display:none}
.status-tag{font-size:11px;padding:1px 7px;border-radius:6px;background:var(--c-main-soft);color:var(--c-main);margin-left:6px;vertical-align:2px}
.status-tag.out{background:#eef0ef;color:var(--c-sub)}
.status-tag.trans{background:#faf3e3;color:var(--c-warn)}

/* 待办行 */
.todo{display:flex;align-items:flex-start;gap:10px;padding:11px 4px;border-bottom:1px solid var(--c-line)}
.todo:last-child{border-bottom:none}
.todo .chk{width:22px;height:22px;border-radius:50%;border:2px solid #b9c6c1;flex-shrink:0;margin-top:1px;
  display:flex;align-items:center;justify-content:center;color:#fff;font-size:13px}
.todo .chk.on{background:var(--c-main);border-color:var(--c-main)}
.todo .txt{flex:1;min-width:0}
.todo .txt .t1{font-size:15px;word-break:break-all}
.todo .txt .t2{font-size:12px;color:var(--c-sub);margin-top:1px}
.todo .txt .t2 .due{color:var(--c-danger);font-weight:600}
.todo .del{color:#c3cfca;font-size:17px;padding:2px 6px;flex-shrink:0}
.todo.done .txt .t1{color:var(--c-sub);text-decoration:line-through}
.todo-group{margin-bottom:14px}
.todo-group .g-head{font-size:13px;font-weight:700;color:var(--c-main);margin:0 2px 2px}

/* 快速添加 */
.quick{display:flex;gap:8px;margin-bottom:14px}
.quick select{flex-shrink:0;width:112px;border:1px solid var(--c-line);border-radius:10px;padding:9px 6px;background:#fff}
.quick input{flex:1;min-width:0;border:1px solid var(--c-line);border-radius:10px;padding:9px 12px;background:#fff;outline:none}
.quick input:focus{border-color:var(--c-main)}
.quick .btn{padding:9px 16px}

/* 我的页 */
.stat{display:flex;text-align:center;padding:16px 4px}
.stat>div{flex:1}
.stat .v{font-size:22px;font-weight:800;color:var(--c-main)}
.stat .k{font-size:12px;color:var(--c-sub);margin-top:2px}
.stat .v.warn{color:var(--c-warn)}
.menu{padding:0}
.menu .mi{display:flex;align-items:center;justify-content:space-between;padding:14px;border-bottom:1px solid var(--c-line);font-size:15px}
.menu .mi:last-child{border-bottom:none}
.menu .mi:active{background:#fafbfa}
.menu .mi .r{color:var(--c-sub);font-size:13px;max-width:55%;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.menu .mi .r.warn{color:var(--c-warn);font-weight:600}
.tip{font-size:13px;color:var(--c-sub);line-height:1.7}
.tip b{color:var(--c-text)}

/* ---------- 患者详情页 ---------- */
#ppage{position:fixed;inset:0;z-index:50;background:var(--c-bg);display:none;flex-direction:column;max-width:560px;margin:0 auto}
#ppage.on{display:flex}
#ppage .pbar{padding:calc(var(--sat) + 10px) 12px 10px;display:flex;align-items:center;gap:6px;background:var(--c-bg);position:sticky;top:0;z-index:5}
#ppage .pbar .back{font-size:22px;padding:2px 10px;color:var(--c-main);font-weight:700}
#ppage .pbar .tt{flex:1;font-size:18px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#ppage .pbar .act{color:var(--c-main);font-size:15px;padding:6px 8px;font-weight:600}
#ppage .meta{padding:0 16px 8px;font-size:13px;color:var(--c-sub)}
#ppage .meta div{margin-top:2px}
.seg{display:flex;background:#e6ebe9;border-radius:10px;padding:3px;margin:6px 16px 4px}
.seg button{flex:1;padding:7px 0;border-radius:8px;font-size:14px;color:var(--c-sub)}
.seg button.on{background:#fff;color:var(--c-main);font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.pbody{flex:1;overflow-y:auto;padding:10px 14px calc(var(--sab) + 20px)}
.kv{margin-bottom:10px}
.kv .k{font-size:12px;color:var(--c-sub);margin-bottom:2px}
.kv .v{font-size:15px;white-space:pre-wrap;word-break:break-word}
.fab{position:fixed;right:18px;bottom:calc(var(--sab) + 76px);width:52px;height:52px;border-radius:50%;
  background:var(--c-main);color:#fff;font-size:28px;display:flex;align-items:center;justify-content:center;
  box-shadow:0 4px 12px rgba(10,110,92,.4);z-index:6}
.exam-item{border-left:3px solid transparent}
.exam-item.imp{border-left-color:var(--c-danger)}
.exam-item .h{display:flex;align-items:baseline;gap:8px}
.exam-item .h .d{font-size:13px;color:var(--c-sub);font-weight:600;flex-shrink:0}
.exam-item .h .t{font-size:15px;font-weight:700;flex:1;min-width:0;word-break:break-all}
.exam-item .f{font-size:14px;color:#41504b;white-space:pre-wrap;word-break:break-word;margin-top:3px}
.exam-item .ops{margin-top:6px;display:flex;gap:14px}
.exam-item .ops button{font-size:12px;color:var(--c-sub)}
.exam-item .ops .imp.on{color:var(--c-danger);font-weight:700}

/* ---------- 底部抽屉 ---------- */
.mask{position:fixed;inset:0;background:rgba(20,35,30,.45);z-index:80;opacity:0;transition:opacity .2s}
.mask.on{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:81;background:#fff;border-radius:18px 18px 0 0;
  max-width:560px;margin:0 auto;transform:translateY(100%);transition:transform .25s;
  padding:16px 16px calc(var(--sab) + 16px);max-height:88vh;overflow-y:auto}
.sheet.on{transform:translateY(0)}
.sheet .grip{width:38px;height:4px;border-radius:2px;background:#dde3e1;margin:0 auto 14px}
.sheet h3{font-size:17px;margin-bottom:14px}
.form label{display:block;font-size:13px;color:var(--c-sub);margin:12px 0 4px}
.form input,.form select,.form textarea{width:100%;border:1px solid var(--c-line);border-radius:10px;padding:10px 12px;background:#fff;outline:none}
.form input:focus,.form textarea:focus{border-color:var(--c-main)}
.form textarea{min-height:72px;resize:vertical}
.form .chkline{display:flex;align-items:center;gap:8px;margin-top:14px;font-size:14px}
.form .chkline input{width:auto}
.form .btns{display:flex;gap:10px;margin-top:18px}
.form .btns .btn{flex:1}
.sheet-act{display:flex;flex-direction:column;gap:10px}
.sheet-act .btn{width:100%;padding:13px}
.btn.line{background:#fff;border:1px solid var(--c-line);color:var(--c-text);font-weight:500}

/* toast */
#toast{position:fixed;left:50%;bottom:calc(var(--sab) + 90px);transform:translateX(-50%) translateY(8px);
  background:rgba(30,45,40,.92);color:#fff;font-size:14px;padding:9px 18px;border-radius:20px;z-index:99;
  opacity:0;pointer-events:none;transition:all .25s;max-width:80vw;text-align:center}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>

<!-- 锁屏 -->
<div id="lock">
  <div class="logo">管</div>
  <h2 id="lock-title">输入 PIN 解锁</h2>
  <div class="hint">数据只存在本机，PIN 防的是旁人随手翻看</div>
  <input id="lock-input" type="tel" inputmode="numeric" maxlength="6" placeholder="PIN 码" autocomplete="off">
  <div class="err" id="lock-err"></div>
  <div class="row">
    <button class="btn-ghost" id="lock-forgot" style="display:none">忘记 PIN？</button>
    <button class="btn-ghost" id="lock-skip" style="display:none">暂不设置</button>
    <button class="btn-ok" id="lock-ok">解锁</button>
  </div>
</div>

<!-- 主界面 -->
<div id="app">
  <header class="appbar">
    <h1 id="bar-title">管床</h1>
    <button class="add" id="btn-add-pt" title="新建患者">＋</button>
  </header>
  <main id="main">
    <!-- 病区 -->
    <section class="view on" id="view-ward"></section>
    <!-- 待办 -->
    <section class="view" id="view-todos"></section>
    <!-- 我的 -->
    <section class="view" id="view-more"></section>
  </main>
  <nav class="tabbar">
    <button data-tab="ward" class="on">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 18v-6a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v6"/><path d="M3 18h18"/><path d="M19 10V6a2 2 0 0 0-2-2H7a2 2 0 0 0-2 2v4"/><circle cx="9" cy="14" r="0.5"/></svg>
      病区<span class="bdg" id="bdg-ward"></span>
    </button>
    <button data-tab="todos">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="m8.5 8 1.8 1.8L14 6.2"/><path d="M8.5 15.5h7"/></svg>
      待办<span class="bdg" id="bdg-todos"></span>
    </button>
    <button data-tab="more">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-6 8-6s8 2 8 6"/></svg>
      我的
    </button>
  </nav>
</div>

<!-- 患者详情 -->
<div id="ppage">
  <div class="pbar">
    <button class="back" id="p-back">‹</button>
    <div class="tt" id="p-title"></div>
    <button class="act" id="p-edit">编辑</button>
  </div>
  <div class="meta" id="p-meta"></div>
  <div class="seg" id="p-seg">
    <button data-pt="ov" class="on">概览</button>
    <button data-pt="hx">病史</button>
    <button data-pt="exam">检验检查</button>
  </div>
  <div class="pbody" id="p-body"></div>
</div>

<div id="toast"></div>
<input type="file" id="file-in" accept=".json,application/json" style="display:none">

<script>
'use strict';
/* ================= 工具 ================= */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now() + '-' + Math.random().toString(36).slice(2));
const today = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); };
const md = d => (d || '').slice(5).replace('-', '/');
const APP_VER = '1.0.0';
function cyrb53(str, seed = 0){ let h1=0xdeadbeef^seed, h2=0x41c6ce57^seed;
  for(let i=0,ch;i<str.length;i++){ ch=str.charCodeAt(i); h1=Math.imul(h1^ch,2654435761); h2=Math.imul(h2^ch,1597334677); }
  h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);
  h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);
  return (4294967296*(2097151&h2)+(h1>>>0)).toString(16); }

function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('on');
  clearTimeout(toast._tm); toast._tm=setTimeout(()=>t.classList.remove('on'),2000); }

/* ================= 数据库 ================= */
let db;
function openDB(){ return new Promise((res,rej)=>{
  const r = indexedDB.open('wardDB', 1);
  r.onupgradeneeded = e => { const d=e.target.result;
    d.createObjectStore('patients',{keyPath:'id'});
    d.createObjectStore('todos',{keyPath:'id'});
    d.createObjectStore('exams',{keyPath:'id'});
    d.createObjectStore('meta',{keyPath:'k'}); };
  r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); });}
const txPut=(st,v)=>new Promise((res,rej)=>{const t=db.transaction(st,'readwrite');t.objectStore(st).put(v);t.oncomplete=res;t.onerror=()=>rej(t.error);});
const txDel=(st,k)=>new Promise((res,rej)=>{const t=db.transaction(st,'readwrite');t.objectStore(st).delete(k);t.oncomplete=res;t.onerror=()=>rej(t.error);});
const txAll=(st)=>new Promise((res,rej)=>{const r=db.transaction(st).objectStore(st).getAll();r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});
const txClear=(st)=>new Promise((res,rej)=>{const t=db.transaction(st,'readwrite');t.objectStore(st).clear();t.oncomplete=res;t.onerror=()=>rej(t.error);});
async function metaGet(){ return (await txAll('meta')).find(x=>x.k==='main') || {k:'main'}; }
const metaPut = m => txPut('meta', m);

/* ================= 状态 ================= */
const state = { patients:[], todos:[], exams:[], meta:{k:'main'}, tab:'ward', cur:null, pTab:'ov', showDone:false, showOut:false };

function sortPt(a,b){ const A=(a.bed||'').trim(), B=(b.bed||'').trim();
  const na=parseFloat(A), nb=parseFloat(B);
  if(!isNaN(na)&&!isNaN(nb)&&String(na)===A.replace(/床$/,'')&&String(nb)===B.replace(/床$/,'')) return na-nb;
  return A.localeCompare(B,'zh',{numeric:true}); }
const activePts = () => state.patients.filter(p=>p.status==='在院').sort(sortPt);
const outPts = () => state.patients.filter(p=>p.status!=='在院').sort(sortPt);
const ptById = id => state.patients.find(p=>p.id===id);
function ptName(p){ const b=(p.bed||'').replace(/床$/,''); return b ? b+'床·'+(p.name||'') : (p.name||'未命名'); }
const openTodos = pid => state.todos.filter(t=>t.patientId===pid && !t.done).sort((a,b)=>b.createdAt-a.createdAt);
const openTodoAll = () => state.todos.filter(t=>!t.done);
const examsOf = pid => state.exams.filter(x=>x.patientId===pid)
  .sort((a,b)=> (b.date||'').localeCompare(a.date||'') || b.createdAt-a.createdAt);

async function markChange(){
  state.meta.changes = (state.meta.changes||0) + 1;
  state.meta.autoBackup = JSON.stringify({patients:state.patients, todos:state.todos, exams:state.exams});
  state.meta.autoBackupAt = Date.now();
  await metaPut(state.meta);
}
async function loadAll(){
  state.patients = await txAll('patients');
  state.todos = await txAll('todos');
  state.exams = await txAll('exams');
  state.meta = await metaGet();
}

/* ================= 锁屏 ================= */
const lock = { mode:'unlock' }; // unlock | setup
function showLock(){
  $('#lock').style.display='flex';
  if(state.meta.pinHash){ lock.mode='unlock'; $('#lock-title').textContent='输入 PIN 解锁';
    $('#lock-forgot').style.display=''; $('#lock-skip').style.display='none'; }
  else { lock.mode='setup'; $('#lock-title').textContent='设置 PIN（4–6 位数字）';
    $('#lock-forgot').style.display='none'; $('#lock-skip').style.display=''; }
  $('#lock-input').value=''; $('#lock-err').textContent='';
  setTimeout(()=>$('#lock-input').focus(), 100);
}
async function tryLock(){
  const v = $('#lock-input').value.trim();
  if(v.length<4){ $('#lock-err').textContent='至少 4 位'; return; }
  const h = cyrb53(v);
  if(lock.mode==='setup'){
    if(!lock.pending){ lock.pending=h; $('#lock-input').value=''; $('#lock-title').textContent='再输一遍确认';
      $('#lock-err').textContent=''; return; }
    if(lock.pending!==h){ lock.pending=null; $('#lock-input').value=''; $('#lock-title').textContent='两次不一致，重新设置 PIN';
      $('#lock-err').textContent=''; return; }
    state.meta.pinHash=h; state.meta.pinSkipped=false; await metaPut(state.meta); lock.pending=null;
  } else {
    if(state.meta.pinHash!==h){ $('#lock-err').textContent='PIN 不对'; $('#lock-input').value=''; return; }
  }
  sessionStorage.setItem('wardUnlocked','1');
  $('#lock').style.display='none';
  $('#app').classList.add('on');
  renderAll();
}

function renderTodos(){

  let h = `<div class="quick">
    <select id="q-pt">${pts.map(p=>`<option value="${p.id}">${esc(ptName(p))}</option>`).join('')}</select>

  if(!pts.length) h = `<div class="empty"><div class="big">📝</div>先在「病区」里建患者，才能加待办</div>`;
  if(!groups.length && pts.length) h += `<div class="empty">全病区待办已清空 ✓</div>`;
  for(const g of groups){
    h += `<div class="todo-group"><div class="g-head">${esc(ptName(g.p))}</div><div class="card" style="padding:2px 12px">` +
      g.list.map(t=>todoRow(t,false)).join('') + `</div></div>`;
  }

    h += `<div class="sect"><span>已完成 ${dones.length}</span><span class="link" id="toggle-done">${state.showDone?'收起':'展开'}</span></div>`;

    }

function todoRow(t, doneView){

const isoToDate = ts => { const d=new Date(ts); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); };
const fmtCreated = ts => { const d=isoToDate(ts); return d===today()?'今天建的':md(d)+'建的'; };
function bindTodoOps(root){
  root.querySelectorAll('.todo').forEach(row=>{
    const id = row.dataset.id;
    row.querySelector('[data-op=toggle]').onclick = async ()=>{

      await txDel('todos', id); await markChange(); renderAll(); toast('已删除');
    };
  });
}
async function addTodo(pid, text, due=''){
  const t = { id:uid(), patientId:pid, text, due, done:false, doneAt:null, createdAt:Date.now() };

}

/* ================= 备份 ================= */
function buildBackup(){
  return { app:'ward-system', ver:1, exportedAt:new Date().toISOString(),
    patients:state.patients, todos:state.todos, exams:state.exams };
}
async function exportBackup(){
  try{
    const data = buildBackup();
    const d = new Date(); const stamp = d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0')+'-'+String(d.getHours()).padStart(2,'0')+String(d.getMinutes()).padStart(2,'0');
    const name = `管床备份-${stamp}.json`;
    const file = new File([JSON.stringify(data,null,2)], name, {type:'application/json'});
    if(navigator.canShare && navigator.canShare({files:[file]})){
      await navigator.share({ files:[file], title:'管床备份' });
    } else {
      const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'})); a.download=name; a.click();
      setTimeout(()=>URL.revokeObjectURL(a.href),5000);
    }
    state.meta.changes=0; state.meta.lastBackup=Date.now(); await metaPut(state.meta);
    toast('备份已导出');
  }catch(err){
    if(err && err.name==='AbortError') return;   // 用户取消分享不算失败
    toast('导出失败：'+err.message);
  }
}
function importBackup(){
  $('#file-in').onchange = async e=>{
    const f = e.target.files[0]; e.target.value='';
    if(!f) return;
    try{
      const data = JSON.parse(await f.text());
      if(data.app!=='ward-system') return toast('不是本系统的备份文件');
      if(!await confirmBox(`备份时间 ${data.exportedAt.slice(0,16).replace('T',' ')}\n患者 ${data.patients.length}、待办 ${data.todos.length}、检查 ${data.exams.length} 条。\n导入会【覆盖】手机当前全部数据，确定？`)) return;
      await txClear('patients'); await txClear('todos'); await txClear('exams');
      for(const p of data.patients) await txPut('patients',p);
      for(const t of data.todos) await txPut('todos',t);
      for(const x of data.exams) await txPut('exams',x);
      await loadAll();
      state.meta.changes=0; state.meta.autoBackup=JSON.stringify({patients:state.patients,todos:state.todos,exams:state.exams}); state.meta.autoBackupAt=Date.now();
      await metaPut(state.meta);
      renderAll(); toast('导入完成');
    }catch(err){ toast('导入失败：'+err.message); }
  };
  $('#file-in').click();
}
async function restoreAuto(){
  const m = state.meta;
  if(!m.autoBackup) return toast('还没有自动备份');
  if(!await confirmBox(`恢复到 ${md(isoToDate(m.autoBackupAt))} 的手机内自动备份？\n会覆盖当前数据。`)) return;
  const data = JSON.parse(m.autoBackup);
  await txClear('patients'); await txClear('todos'); await txClear('exams');
  for(const p of data.patients) await txPut('patients',p);
  for(const t of data.todos) await txPut('todos',t);
  for(const x of data.exams) await txPut('exams',x);
  await loadAll(); renderAll(); toast('已恢复');
}

let _sheetClose=null;
function sheet({title, body, okText='确定', onOk, onMount, onUnmount, hideOk, danger}){
  closeSheet();
  const mask=document.createElement('div'); mask.className='mask';
  const sh=document.createElement('div'); sh.className='sheet';
  sh.innerHTML = `<div class="grip"></div><h3>${esc(title)}</h3>${body}
    ${hideOk?'':`<div class="btns" style="display:flex;gap:10px;margin-top:16px">
      <button class="btn line" style="flex:1;padding:12px" id="sh-cancel">取消</button>
      <button class="btn ${danger?'danger':''}" style="flex:2;padding:12px;background:${danger?'#c0392b':'var(--c-main)'};color:#fff" id="sh-ok">${esc(okText)}</button></div>`}`;
  document.body.append(mask, sh);
  requestAnimationFrame(()=>{ mask.classList.add('on'); sh.classList.add('on'); });
  const close = ()=>{ if(onUnmount) try{ onUnmount(); }catch(e){} _sheetClose=null;
    mask.classList.remove('on'); sh.classList.remove('on'); setTimeout(()=>{mask.remove();sh.remove();},260); };
  _sheetClose = close;
  mask.onclick = close;
  const c=sh.querySelector('#sh-cancel'); if(c) c.onclick=close;
  const ok=sh.querySelector('#sh-ok');
  if(ok) ok.onclick = async ()=>{ if(!onOk) return close();
    const r = await onOk(sh); if(r!==false) close(); };
  if(onMount) onMount(sh);
}
function closeSheet(){ if(_sheetClose){ _sheetClose(); _sheetClose=null; } }
function confirmBox(msg){
  return new Promise(res=>{
    const mask=document.createElement('div'); mask.className='mask';
    const sh=document.createElement('div'); sh.className='sheet';
    sh.innerHTML=`<div class="grip"></div><div style="white-space:pre-wrap;font-size:15px;line-height:1.7;padding:4px 2px 6px">${esc(msg)}</div>
      <div style="display:flex;gap:10px;margin-top:14px">

      <button class="btn" style="flex:1;padding:12px;background:var(--c-main);color:#fff" id="cf-yes">确定</button></div>`;
    document.body.append(mask, sh);
    requestAnimationFrame(()=>{ mask.classList.add('on'); sh.classList.add('on'); });
    const done=v=>{ mask.classList.remove('on'); sh.classList.remove('on'); setTimeout(()=>{mask.remove();sh.remove();},260); res(v); };
    mask.onclick=()=>done(false);
    sh.querySelector('#cf-no').onclick=()=>done(false);
    sh.querySelector('#cf-yes').onclick=()=>done(true);
  });
}

/* ================= AI 功能（智谱 GLM 开放平台，浏览器直连） ================= */
const PRIVACY_NOTE = '⚠️ 隐私确认：你选择了「只处理脱敏内容」。发送前请确认内容已去除姓名、病历号、住院号、条码等身份信息——点击发送即表示内容已脱敏。';

const AI_DEFAULTS = {
  base: 'https://open.bigmodel.cn/api/paas/v4',
  chat: 'glm-4.5-flash',
  vision: 'glm-4.5v',
  asr: 'glm-asr',
  asrUrl: 'https://open.bigmodel.cn/api/paas/v4/audio/transcriptions',
};
function aiModels(){
  const m = state.meta;
  return {
    chat: m.aiModelChat || AI_DEFAULTS.chat,
    vision: m.aiModelVision || AI_DEFAULTS.vision,
    asr: m.aiModelAsr || AI_DEFAULTS.asr,
    asrUrl: m.aiAsrUrl || AI_DEFAULTS.asrUrl,
  };
}
function needKey(){
  if(state.meta.aiKey) return false;
  toast('先到「我的 → AI 设置」粘贴 API Key'); return true;
}
async function callChat(messages, model, temperature, keyOverride){
  const ctrl = new AbortController();
  const tm = setTimeout(()=>ctrl.abort(), 90000);
  try{
    const r = await fetch(AI_DEFAULTS.base + '/chat/completions', {
      method:'POST',
      headers:{'Content-Type':'application/json', 'Authorization':'Bearer '+(keyOverride||state.meta.aiKey)},
      body: JSON.stringify({model, messages, temperature: temperature==null?0.2:temperature}),
      signal: ctrl.signal,
    });
    const data = await r.json().catch(()=>({}));
    if(!r.ok) throw new Error((data.error && data.error.message) || ('HTTP '+r.status));
    const c = data.choices && data.choices[0] && data.choices[0].message;
    return (c && c.content) || '';
  } finally { clearTimeout(tm); }
}
async function callAsr(blob){
  const m = aiModels();
  const fd = new FormData();
  fd.append('file', new File([blob], 'rec.'+((blob.type||'').includes('mp4')?'m4a':'webm'), {type: blob.type||'audio/mp4'}));
  fd.append('model', m.asr);
  const r = await fetch(m.asrUrl, {method:'POST', headers:{'Authorization':'Bearer '+state.meta.aiKey}, body:fd});
  const data = await r.json().catch(()=>({}));
  if(!r.ok) throw new Error((data.error && data.error.message) || ('HTTP '+r.status));
  return data.text || (data.choices && data.choices[0] && data.choices[0].message && data.choices[0].message.content) || '';
}
function extractJSON(txt){
  const m = txt.match(/\{[\s\S]*\}|\[[\s\S]*\]/);
  if(!m) throw new Error('AI 未返回可解析的结果：'+String(txt).slice(0,100));
  return JSON.parse(m[0]);
}
function compressImage(file, maxSide, quality){
  maxSide = maxSide||1600; quality = quality||0.85;
  return new Promise((res,rej)=>{
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = ()=>{
      const sc = Math.min(1, maxSide/Math.max(img.width, img.height));
      const cv = document.createElement('canvas');
      cv.width = Math.round(img.width*sc); cv.height = Math.round(img.height*sc);
      cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
      URL.revokeObjectURL(url);
      cv.toBlob(b=> b?res(b):rej(new Error('图片处理失败')), 'image/jpeg', quality);
    };
    img.onerror = ()=>rej(new Error('图片读取失败'));
    img.src = url;
  });
}
const blobToDataURL = blob => new Promise((res,rej)=>{ const fr=new FileReader(); fr.onload=()=>res(fr.result); fr.onerror=rej; fr.readAsDataURL(blob); });

      <div style="display:flex;gap:8px;margin-top:8px">
        <button class="btn block ghost" id="vc-parse" style="display:none">🤖 拆解为待办</button>
        <button class="btn block ghost" id="vc-hx" style="display:none">🤖 整理为病史</button>
      </div>
      <div id="vc-list" style="margin-top:8px"></div>
      <button class="btn block" id="vc-add" style="display:none;margin-top:8px">加入所选待办</button>
      <div id="vc-err" style="color:var(--c-danger);font-size:13px;margin-top:8px;white-space:pre-wrap"></div></div>`,
    onUnmount: ()=>{
      if(timer) clearInterval(timer);
      if(rec && rec.state==='recording'){ try{ rec.stop(); }catch(e){} }
    },
    onMount: el=>{
      const recBtn = el.querySelector('#vc-rec');
      recBtn.onclick = async ()=>{
        if(rec && rec.state==='recording'){ rec.stop(); return; }
        try{
          const stream = await navigator.mediaDevices.getUserMedia({audio:true});
          chunks = [];
          rec = new MediaRecorder(stream);
          rec.ondataavailable = e=>{ if(e.data.size) chunks.push(e.data); };
          rec.onstop = async ()=>{
            stream.getTracks().forEach(t=>t.stop());
            if(timer) clearInterval(timer);
            recBtn.textContent = '🎙️ 重新录音';
            el.querySelector('#vc-status').textContent = '转写中…';
            const blob = new Blob(chunks, {type: rec.mimeType||'audio/mp4'});
            try{
              const txt = await callAsr(blob);
              if(!txt.trim()) throw new Error('未识别到内容');
              const ta = el.querySelector('#vc-text');
              ta.value = txt; ta.style.display='block';
              el.querySelector('#vc-lb').style.display='block';
              el.querySelector('#vc-parse').style.display='block';
              el.querySelector('#vc-hx').style.display='block';
              el.querySelector('#vc-status').textContent = '已转写，可修改后拆解';
            }catch(err){
              el.querySelector('#vc-err').textContent = '转写失败：'+err.message;
              el.querySelector('#vc-status').textContent = '';
            }
          };
          rec.start();
          t0 = Date.now();
          recBtn.textContent = '⏹ 停止录音';
          timer = setInterval(()=>{
            const s = Math.round((Date.now()-t0)/1000);
            el.querySelector('#vc-status').textContent = '录音中 '+s+'s（口述待办，说完点停止）';
          }, 300);
        }catch(err){
          el.querySelector('#vc-err').textContent = '无法使用麦克风：'+err.message;
        }
      };
      el.querySelector('#vc-parse').onclick = async ()=>{
        const src = el.querySelector('#vc-text').value.trim();
        if(!src) return toast('没有可拆解的文本');
        const pb = el.querySelector('#vc-parse');
        pb.textContent = 'AI 拆解中…'; pb.disabled = true;
        try{
          const out = await callChat([
            {role:'system', content:'你是病房医生助理。把口述内容拆解为待办事项数组，只输出 JSON 数组，每项形如 {"text":"待办内容","due":"YYYY-MM-DD 或空字符串"}。口语转简洁书面待办；相对时间（明天/后天/周X）按今天 '+today()+' 换算；不编造内容。'},
            {role:'user', content: src}
          ], aiModels().chat);
          parsed = extractJSON(out);
          if(!Array.isArray(parsed) || !parsed.length) throw new Error('没拆出待办，可手动添加');
          const box = el.querySelector('#vc-list');
          box.innerHTML = parsed.map((t,i)=>`<label style="display:flex;gap:8px;align-items:flex-start;padding:6px 0;border-bottom:1px solid var(--c-line)">
            <input type="checkbox" checked data-i="${i}" style="margin-top:3px">
            <span style="font-size:14px">${esc(t.text)}${t.due&&/^\d{4}-\d{2}-\d{2}$/.test(t.due)?` <span style="color:var(--c-danger);font-size:12px">${esc(md(t.due))}前</span>`:''}</span></label>`).join('');
          el.querySelector('#vc-add').style.display='block';
          pb.textContent = '🤖 重新拆解'; pb.disabled = false;
        }catch(err){
          el.querySelector('#vc-err').textContent = '拆解失败：'+err.message;
          pb.textContent = '🤖 AI 拆解为待办'; pb.disabled = false;
        }
      };
      el.querySelector('#vc-hx').onclick = async ()=>{
        if(el.querySelector('#vc-add').style.display !== 'none'){
          if(!await confirmBox('待办清单还没加入。整理病史会关闭本窗口，未加入的待办不保存。\n先去「加入所选待办」，还是继续？')) return;
        }
        const src = el.querySelector('#vc-text').value.trim();
        if(!src) return toast('没有可整理的文本');
        const p = ptById(el.querySelector('#vc-pt').value);
        const hb = el.querySelector('#vc-hx');
        hb.textContent = 'AI 整理中…'; hb.disabled = true;
        try{
          const out = await callChat([
            {role:'system', content:'你是神经外科病房的医生助理。从这段录音转写（可能包含问病史、家属叙述、查房讨论）中提取病史信息，只输出一个 JSON 对象：{"chief":"主诉","present":"现病史","past":"既往史","exam":"查体要点"}。只提取医学内容，忽略任何患者身份信息与与病史无关的安排、闲聊；原文没有的字段用空字符串；不要编造；保持中文。'},
            {role:'user', content: src}
          ], aiModels().chat);
          const j = extractJSON(out);
          closeSheet();
          hxResultSheet(p, j);
        }catch(err){
          el.querySelector('#vc-err').textContent = '整理失败：'+err.message;
          hb.textContent = '🤖 整理为病史'; hb.disabled = false;
        }
      };
      el.querySelector('#vc-add').onclick = async ()=>{
        const pid = el.querySelector('#vc-pt').value;
        const items = parsed.filter((t,i)=>{
          const cb = el.querySelector('input[data-i="'+i+'"]'); return cb && cb.checked;
        });
        if(!items.length) return toast('没勾选任何待办');
        for(const t of items){
          await addTodo(pid, String(t.text||'').trim(), t.due && /^\d{4}-\d{2}-\d{2}$/.test(t.due) ? t.due : '');
        }
        renderAll(); closeSheet(); toast('已加入 '+items.length+' 条待办');
      };
    }});
}

/* ================= 框架导航 ================= */
function switchTab(t){
  state.tab=t;
  document.querySelectorAll('.tabbar button').forEach(b=>b.classList.toggle('on', b.dataset.tab===t));
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('on'));
  $('#view-'+t).classList.add('on');
  $('#bar-title').textContent = t==='ward'?'管床': t==='todos'?'待办':'我的';
  $('#btn-add-pt').style.display = t==='ward' ? '' : 'none';
  $('#main').scrollTop = 0;
}
function renderAll(){
  renderWard(); renderTodos(); renderMore();
  const n = openTodoAll().length;
  const b1=$('#bdg-ward'), b2=$('#bdg-todos');
  b2.textContent=n; b2.style.display = n?'':'none';
  b1.style.display='none';
}

/* ================= 启动 ================= */
(async function init(){
  db = await openDB();
  await loadAll();
  importBackup();
  $('#lock-ok').onclick = tryLock;
  $('#lock-input').onkeydown = e=>{ if(e.key==='Enter') tryLock(); };
  $('#lock-forgot').onclick = async ()=>{
    if(!await confirmBox('重置将【清空全部数据】并取消 PIN！\n如果有备份文件，重置后可以导入恢复。确定重置？')) return;
    await resetAll();
  };
  $('#lock-skip').onclick = async ()=>{
    state.meta.pinSkipped = true;
    await metaPut(state.meta);
    sessionStorage.setItem('wardUnlocked','1');
    $('#lock').style.display='none';
    $('#app').classList.add('on');
    renderAll();
  };
  $('#btn-add-pt').onclick = ()=> patientSheet(null);
  document.querySelectorAll('.tabbar button').forEach(b=> b.onclick=()=>switchTab(b.dataset.tab));
  $('#p-back').onclick = ()=>{ $('#ppage').classList.remove('on'); state.cur=null; renderAll(); };
  $('#p-edit').onclick = ()=> patientSheet(state.cur);
  $('#p-seg').querySelectorAll('button').forEach(b=> b.onclick=()=>{
    state.pTab=b.dataset.pt;
    $('#p-seg').querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));
    renderPBody();
  });
  if('serviceWorker' in navigator){
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  }
  // 挂起恢复（同会话）且未设 PIN：直接进，免得每次冷启动都被强制设 PIN
  if(sessionStorage.getItem('wardUnlocked')==='1' && !state.meta.pinHash){
    $('#app').classList.add('on'); renderAll(); return;
  }
  // 有 PIN → 输 PIN；从未设置且从未跳过 → 首次引导；跳过过 → 直接进
  if(state.meta.pinHash || !state.meta.pinSkipped){ showLock(); return; }
  $('#app').classList.add('on'); renderAll();
})();
</script>
