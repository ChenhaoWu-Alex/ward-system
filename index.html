<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="海马">
<meta name="theme-color" content="#0a6e5c">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>海马 · Hippocampus</title>
<style>
:root{
  --c-main:#0a6e5c; --c-main-dark:#085a4b; --c-main-soft:#e3f0ed;
  --c-bg:#f4f6f5; --c-card:#ffffff; --c-line:#e8ecea;
  --c-text:#22302c; --c-sub:#7b8a85; --c-danger:#c0392b; --c-warn:#b9770e;
  --radius:14px;
  --sat: env(safe-area-inset-top); --sab: env(safe-area-inset-bottom);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  background:var(--c-bg); color:var(--c-text); font-size:16px; line-height:1.5;
  overscroll-behavior-y:none;
}
button{font-family:inherit;border:none;background:none;color:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:16px;color:var(--c-text)}

/* ---------- 锁屏 ---------- */
#lock{position:fixed;inset:0;z-index:100;background:linear-gradient(160deg,#0a6e5c,#08513f);
  display:none;flex-direction:column;align-items:center;justify-content:center;color:#fff;padding:24px}
#lock .logo{width:84px;height:84px;border-radius:22px;background:rgba(255,255,255,.15);
  display:flex;align-items:center;justify-content:center;font-size:44px;font-weight:700;margin-bottom:28px}
#lock h2{font-size:18px;font-weight:600;margin-bottom:6px}
#lock .hint{font-size:13px;opacity:.75;margin-bottom:26px}
#lock input{width:200px;text-align:center;font-size:26px;letter-spacing:10px;padding:10px 4px 10px 14px;
  border:none;border-bottom:2px solid rgba(255,255,255,.5);background:transparent;color:#fff;outline:none}
#lock input::placeholder{color:rgba(255,255,255,.4);letter-spacing:0;font-size:15px}
#lock .row{display:flex;gap:14px;margin-top:26px}
#lock .row button{padding:10px 22px;border-radius:10px;font-size:15px}
#lock .btn-ok{background:#fff;color:var(--c-main);font-weight:600}
#lock .btn-ghost{color:rgba(255,255,255,.85);border:1px solid rgba(255,255,255,.4)}
#lock .err{color:#ffd7d0;font-size:13px;height:20px;margin-top:14px}

/* ---------- 主框架 ---------- */
#app{display:none;flex-direction:column;height:100%;max-width:560px;margin:0 auto;background:var(--c-bg)}
#app.on{display:flex}
header.appbar{padding:calc(var(--sat) + 10px) 16px 10px;display:flex;align-items:center;justify-content:space-between;background:var(--c-bg);position:sticky;top:0;z-index:10}
header.appbar h1{font-size:22px;font-weight:700}
header.appbar .add{width:34px;height:34px;border-radius:50%;background:var(--c-main);color:#fff;font-size:24px;line-height:1;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(10,110,92,.35)}
main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:4px 14px 20px}
.tabbar{display:flex;background:var(--c-card);border-top:1px solid var(--c-line);
  padding-bottom:var(--sab);position:sticky;bottom:0}
.tabbar button{flex:1;padding:8px 0 6px;display:flex;flex-direction:column;align-items:center;gap:2px;
  color:var(--c-sub);font-size:11px;position:relative}
.tabbar button.on{color:var(--c-main);font-weight:600}
.tabbar svg{width:24px;height:24px}
.tabbar .bdg{position:absolute;top:4px;right:calc(50% - 20px);min-width:16px;height:16px;border-radius:8px;
  background:var(--c-danger);color:#fff;font-size:10px;line-height:16px;padding:0 4px;display:none}
.view{display:none}.view.on{display:block}

/* ---------- 通用组件 ---------- */
.card{background:var(--c-card);border-radius:var(--radius);padding:14px;margin-bottom:12px;box-shadow:0 1px 2px rgba(30,50,45,.04)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--c-main);color:#fff;
  border-radius:10px;padding:10px 18px;font-size:15px;font-weight:600}
.btn.block{width:100%;padding:13px;font-size:16px}
.btn.ghost{background:var(--c-main-soft);color:var(--c-main)}
.btn.danger{background:#fbeeeb;color:var(--c-danger)}
.btn.sm{padding:5px 12px;font-size:13px;border-radius:8px;font-weight:500}
.empty{text-align:center;color:var(--c-sub);padding:40px 20px;font-size:14px}
.empty .big{font-size:40px;margin-bottom:10px}
.sect{font-size:13px;color:var(--c-sub);margin:16px 2px 8px;display:flex;justify-content:space-between;align-items:baseline}
.sect .link{color:var(--c-main);font-size:13px}
.badge{min-width:20px;height:20px;border-radius:10px;background:var(--c-danger);color:#fff;font-size:12px;
  line-height:20px;text-align:center;padding:0 6px;font-weight:600}
.badge.gray{background:#d6dedb;color:var(--c-sub)}

/* 患者卡片 */
.pt{display:flex;align-items:center;gap:12px;padding:13px 14px}
.pt .bed{min-width:52px;text-align:center}
.pt .bed .n{font-size:21px;font-weight:800;color:var(--c-main);line-height:1.15}
.pt .bed .t{font-size:11px;color:var(--c-sub)}
.pt .mid{flex:1;min-width:0}
.pt .mid .name{font-size:17px;font-weight:700}
.pt .mid .dx{font-size:13px;color:var(--c-sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.pt .mid .note{font-size:12px;color:var(--c-warn);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.pt .mid .note:empty{display:none}
.status-tag{font-size:11px;padding:1px 7px;border-radius:6px;background:var(--c-main-soft);color:var(--c-main);margin-left:6px;vertical-align:2px}
.status-tag.out{background:#eef0ef;color:var(--c-sub)}
.status-tag.trans{background:#faf3e3;color:var(--c-warn)}

/* 待办行 */
.todo{display:flex;align-items:flex-start;gap:10px;padding:11px 4px;border-bottom:1px solid var(--c-line)}
.todo:last-child{border-bottom:none}
.todo .chk{width:22px;height:22px;border-radius:50%;border:2px solid #b9c6c1;flex-shrink:0;margin-top:1px;
  display:flex;align-items:center;justify-content:center;color:#fff;font-size:13px}
.todo .chk.on{background:var(--c-main);border-color:var(--c-main)}
.todo .txt{flex:1;min-width:0}
.todo .txt .t1{font-size:15px;word-break:break-all}
.todo .txt .t2{font-size:12px;color:var(--c-sub);margin-top:1px}
.todo .txt .t2 .due{color:var(--c-danger);font-weight:600}
.todo .del{color:#c3cfca;font-size:17px;padding:2px 6px;flex-shrink:0}
.todo.done .txt .t1{color:var(--c-sub);text-decoration:line-through}
.todo-group{margin-bottom:14px}
.todo-group .g-head{font-size:13px;font-weight:700;color:var(--c-main);margin:0 2px 2px}

/* 快速添加 */
.quick{display:flex;gap:8px;margin-bottom:14px}
.quick select{flex-shrink:0;width:112px;border:1px solid var(--c-line);border-radius:10px;padding:9px 6px;background:#fff}
.quick input{flex:1;min-width:0;border:1px solid var(--c-line);border-radius:10px;padding:9px 12px;background:#fff;outline:none}
.quick input:focus{border-color:var(--c-main)}
.quick .btn{padding:9px 16px}

/* 我的页 */
.stat{display:flex;text-align:center;padding:16px 4px}
.stat>div{flex:1}
.stat .v{font-size:22px;font-weight:800;color:var(--c-main)}
.stat .k{font-size:12px;color:var(--c-sub);margin-top:2px}
.stat .v.warn{color:var(--c-warn)}
.menu{padding:0}
.menu .mi{display:flex;align-items:center;justify-content:space-between;padding:14px;border-bottom:1px solid var(--c-line);font-size:15px}
.menu .mi:last-child{border-bottom:none}
.menu .mi:active{background:#fafbfa}
.menu .mi .r{color:var(--c-sub);font-size:13px;max-width:55%;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.menu .mi .r.warn{color:var(--c-warn);font-weight:600}
.tip{font-size:13px;color:var(--c-sub);line-height:1.7}
.tip b{color:var(--c-text)}

/* ---------- 患者详情页 ---------- */
#ppage{position:fixed;inset:0;z-index:50;background:var(--c-bg);display:none;flex-direction:column;max-width:560px;margin:0 auto}
#ppage.on{display:flex}
#ppage .pbar{padding:calc(var(--sat) + 10px) 12px 10px;display:flex;align-items:center;gap:6px;background:var(--c-bg);position:sticky;top:0;z-index:5}
#ppage .pbar .back{font-size:22px;padding:2px 10px;color:var(--c-main);font-weight:700}
#ppage .pbar .tt{flex:1;font-size:18px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#ppage .pbar .act{color:var(--c-main);font-size:15px;padding:6px 8px;font-weight:600}
#ppage .meta{padding:0 16px 8px;font-size:13px;color:var(--c-sub)}
#ppage .meta div{margin-top:2px}
.seg{display:flex;background:#e6ebe9;border-radius:10px;padding:3px;margin:6px 16px 4px}
.seg button{flex:1;padding:7px 0;border-radius:8px;font-size:14px;color:var(--c-sub)}
.seg button.on{background:#fff;color:var(--c-main);font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.pbody{flex:1;overflow-y:auto;padding:10px 14px calc(var(--sab) + 20px)}
.kv{margin-bottom:10px}
.kv .k{font-size:12px;color:var(--c-sub);margin-bottom:2px}
.kv .v{font-size:15px;white-space:pre-wrap;word-break:break-word}
.fab{position:fixed;right:18px;bottom:calc(var(--sab) + 76px);width:52px;height:52px;border-radius:50%;
  background:var(--c-main);color:#fff;font-size:28px;display:flex;align-items:center;justify-content:center;
  box-shadow:0 4px 12px rgba(10,110,92,.4);z-index:6}
.exam-item{border-left:3px solid transparent}
.exam-item.imp{border-left-color:var(--c-danger)}
.exam-item .h{display:flex;align-items:baseline;gap:8px}
.exam-item .h .d{font-size:13px;color:var(--c-sub);font-weight:600;flex-shrink:0}
.exam-item .h .t{font-size:15px;font-weight:700;flex:1;min-width:0;word-break:break-all}
.exam-item .f{font-size:14px;color:#41504b;white-space:pre-wrap;word-break:break-word;margin-top:3px}
.exam-item .ops{margin-top:6px;display:flex;gap:14px}
.exam-item .ops button{font-size:12px;color:var(--c-sub)}
.exam-item .ops .imp.on{color:var(--c-danger);font-weight:700}

/* ---------- 底部抽屉 ---------- */
.mask{position:fixed;inset:0;background:rgba(20,35,30,.45);z-index:80;opacity:0;transition:opacity .2s}
.mask.on{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:81;background:#fff;border-radius:18px 18px 0 0;
  max-width:560px;margin:0 auto;transform:translateY(100%);transition:transform .25s;
  padding:16px 16px calc(var(--sab) + 16px);max-height:88vh;overflow-y:auto}
.sheet.on{transform:translateY(0)}
.sheet .grip{width:38px;height:4px;border-radius:2px;background:#dde3e1;margin:0 auto 14px}
.sheet h3{font-size:17px;margin-bottom:14px}
.form label{display:block;font-size:13px;color:var(--c-sub);margin:12px 0 4px}
.form input,.form select,.form textarea{width:100%;border:1px solid var(--c-line);border-radius:10px;padding:10px 12px;background:#fff;outline:none}
.form input:focus,.form textarea:focus{border-color:var(--c-main)}
.form textarea{min-height:72px;resize:vertical}
.form .chkline{display:flex;align-items:center;gap:8px;margin-top:14px;font-size:14px}
.form .chkline input{width:auto}
.form .btns{display:flex;gap:10px;margin-top:18px}
.form .btns .btn{flex:1}
.sheet-act{display:flex;flex-direction:column;gap:10px}
.sheet-act .btn{width:100%;padding:13px}
.btn.line{background:#fff;border:1px solid var(--c-line);color:var(--c-text);font-weight:500}

/* toast */
#toast{position:fixed;left:50%;bottom:calc(var(--sab) + 90px);transform:translateX(-50%) translateY(8px);
  background:rgba(30,45,40,.92);color:#fff;font-size:14px;padding:9px 18px;border-radius:20px;z-index:99;
  opacity:0;pointer-events:none;transition:all .25s;max-width:80vw;text-align:center}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

/* 病区快速入口行 */
.quick-entrys{display:flex;gap:8px;margin:6px 0 14px}
.quick-entrys .ent{flex:1;background:var(--c-card);border:1px solid var(--c-line);border-radius:12px;padding:11px 4px;
  font-size:13px;font-weight:600;color:var(--c-main);box-shadow:0 1px 2px rgba(30,50,45,.04)}
.quick-entrys .ent:active{background:var(--c-main-soft)}

/* 待办 / 速记全屏页：复用患者详情页的结构样式 */
#todos-page,#notes-page{position:fixed;inset:0;z-index:50;background:var(--c-bg);display:none;flex-direction:column;max-width:560px;margin:0 auto}
#todos-page.on,#notes-page.on{display:flex}
#todos-page .pbar,#notes-page .pbar{padding:calc(var(--sat) + 10px) 12px 10px;display:flex;align-items:center;gap:6px;background:var(--c-bg)}
#todos-page .pbar .back,#notes-page .pbar .back{font-size:22px;padding:2px 10px;color:var(--c-main);font-weight:700}
#todos-page .pbar .tt,#notes-page .pbar .tt{flex:1;font-size:18px;font-weight:700}

/* 待办行「转档案」按钮 */
.todo .arc{color:var(--c-main);font-size:12px;padding:3px 7px;flex-shrink:0;border:1px solid var(--c-line);border-radius:8px;background:#fff}
</style>
</head>
<body>

<!-- 锁屏 -->
<div id="lock">
  <div class="logo">H</div>
  <h2 id="lock-title">输入 PIN 解锁</h2>
  <div class="hint">数据只存在本机，PIN 防的是旁人随手翻看</div>
  <input id="lock-input" type="tel" inputmode="numeric" maxlength="6" placeholder="PIN 码" autocomplete="off">
  <div class="err" id="lock-err"></div>
  <div class="row">
    <button class="btn-ghost" id="lock-forgot" style="display:none">忘记 PIN？</button>
    <button class="btn-ghost" id="lock-skip" style="display:none">暂不设置</button>
    <button class="btn-ok" id="lock-ok">解锁</button>
  </div>
</div>

<!-- 主界面 -->
<div id="app">
  <header class="appbar">
    <h1 id="bar-title">海马</h1>
    <button class="add" id="btn-add-pt" title="新建患者">＋</button>
  </header>
  <main id="main">
    <!-- 病区 -->
    <section class="view on" id="view-ward"></section>
    <!-- 我的 -->
    <section class="view" id="view-more"></section>
  </main>
  <nav class="tabbar">
    <button data-tab="ward" class="on">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 18v-6a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v6"/><path d="M3 18h18"/><path d="M19 10V6a2 2 0 0 0-2-2H7a2 2 0 0 0-2 2v4"/><circle cx="9" cy="14" r="0.5"/></svg>
      病区<span class="bdg" id="bdg-ward"></span>
    </button>
    <button data-tab="more">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-6 8-6s8 2 8 6"/></svg>
      我的
    </button>
  </nav>
</div>

<!-- 患者详情 -->
<div id="ppage">
  <div class="pbar">
    <button class="back" id="p-back">‹</button>
    <div class="tt" id="p-title"></div>
    <button class="act" id="p-edit">编辑</button>
  </div>
  <div class="meta" id="p-meta"></div>
  <div class="seg" id="p-seg">
    <button data-pt="ov" class="on">概览</button>
    <button data-pt="hx">病史</button>
    <button data-pt="exam">检验检查</button>
  </div>
  <div class="pbody" id="p-body"></div>
</div>

<!-- 待办全屏页 -->
<div id="todos-page">
  <div class="pbar">
    <button class="back" id="tp-back">‹</button>
    <div class="tt">全病区待办</div>
  </div>
  <div class="pbody" id="tp-body" style="padding-top:0"></div>
</div>

<!-- 速记全屏页 -->
<div id="notes-page">
  <div class="pbar">
    <button class="back" id="np-back">‹</button>
    <div class="tt">速记 · 科室心得</div>
  </div>
  <div class="pbody" id="np-body" style="padding-top:0"></div>
</div>

<div id="toast"></div>
<input type="file" id="file-in" accept=".json,application/json" style="display:none">

<script>
'use strict';
/* ================= 工具 ================= */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now() + '-' + Math.random().toString(36).slice(2));
const today = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); };
const md = d => (d || '').slice(5).replace('-', '/');
const APP_VER = '2.3.0';
function cyrb53(str, seed = 0){ let h1=0xdeadbeef^seed, h2=0x41c6ce57^seed;
  for(let i=0,ch;i<str.length;i++){ ch=str.charCodeAt(i); h1=Math.imul(h1^ch,2654435761); h2=Math.imul(h2^ch,1597334677); }
  h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);
  h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);
  return (4294967296*(2097151&h2)+(h1>>>0)).toString(16); }

function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('on');
  clearTimeout(toast._tm); toast._tm=setTimeout(()=>t.classList.remove('on'),2000); }

/* ================= 数据库 ================= */
let db;
function openDB(){ return new Promise((res,rej)=>{
  let settled = false;
  const r = indexedDB.open('wardDB', 3);
  // 升级被其他未关闭的页面阻塞时，IndexedDB 会无声挂起——用超时把故障变成看得见的提示
  const tm = setTimeout(()=>{ if(!settled){ settled = true;
    rej(new Error('数据库打开超时。请彻底关闭所有海马页面（含其他标签/窗口）后重新打开；仍不行则重启浏览器。')); } }, 8000);
  r.onupgradeneeded = e => { const d=e.target.result;
    if(!d.objectStoreNames.contains('patients')) d.createObjectStore('patients',{keyPath:'id'});
    if(!d.objectStoreNames.contains('todos')) d.createObjectStore('todos',{keyPath:'id'});
    if(!d.objectStoreNames.contains('exams')) d.createObjectStore('exams',{keyPath:'id'});
    if(!d.objectStoreNames.contains('meta')) d.createObjectStore('meta',{keyPath:'k'});
    if(!d.objectStoreNames.contains('notes')) d.createObjectStore('notes',{keyPath:'id'});
    if(!d.objectStoreNames.contains('plays')) d.createObjectStore('plays',{keyPath:'id'}); };
  r.onblocked = () => { /* 旧版本页面还开着：等它关闭；超时兜底会提示用户 */ };
  r.onsuccess = () => { if(!settled){ settled = true; clearTimeout(tm);
    const d = r.result;
    // 未来版本升级时，本页面若还在旧版本上，主动关闭连接放行升级（防两头开页面卡死）
    try{ d.onversionchange = () => { try{ d.close(); }catch(e){} location.reload(); }; }catch(e){}
    res(d); } };
  r.onerror = () => { if(!settled){ settled = true; clearTimeout(tm); rej(r.error); } }; });}
const txPut=(st,v)=>new Promise((res,rej)=>{const t=db.transaction(st,'readwrite');t.objectStore(st).put(v);t.oncomplete=res;t.onerror=()=>rej(t.error);});
const txDel=(st,k)=>new Promise((res,rej)=>{const t=db.transaction(st,'readwrite');t.objectStore(st).delete(k);t.oncomplete=res;t.onerror=()=>rej(t.error);});
const txAll=(st)=>new Promise((res,rej)=>{const r=db.transaction(st).objectStore(st).getAll();r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});
const txClear=(st)=>new Promise((res,rej)=>{const t=db.transaction(st,'readwrite');t.objectStore(st).clear();t.oncomplete=res;t.onerror=()=>rej(t.error);});
async function metaGet(){ return (await txAll('meta')).find(x=>x.k==='main') || {k:'main'}; }
const metaPut = m => txPut('meta', m);

/* ================= 状态 ================= */
const state = { patients:[], todos:[], exams:[], notes:[], plays:[], meta:{k:'main'}, tab:'ward', cur:null, pTab:'ov', showDone:false, showOut:false, lastDept:'', lastPlay:'', noteFilter:'' };
/* 速记类型：note=科室心得，advice=病历指导意见（上级查房意见等） */
const NOTE_TYPES = { note:'心得', advice:'指导意见' };
const noteTypeLabel = t => NOTE_TYPES[t] || '心得';
const noteImgs = n => n.imgs || (n.img ? [n.img] : []);   // 兼容旧单图字段

function sortPt(a,b){ const A=(a.bed||'').trim(), B=(b.bed||'').trim();
  const na=parseFloat(A), nb=parseFloat(B);
  if(!isNaN(na)&&!isNaN(nb)&&String(na)===A.replace(/床$/,'')&&String(nb)===B.replace(/床$/,'')) return na-nb;
  return A.localeCompare(B,'zh',{numeric:true}); }
const curDept = () => state.meta.curDept || '';
const inCurDept = p => !curDept() || !p.dept || p.dept===curDept();
const activePts = () => state.patients.filter(p=>p.status==='在院' && inCurDept(p)).sort(sortPt);
const outPts = () => state.patients.filter(p=>p.status!=='在院').sort(sortPt);
const ptById = id => state.patients.find(p=>p.id===id);
function ptName(p){ const b=(p.bed||'').replace(/床$/,''); return b ? b+'床·'+(p.name||'') : (p.name||'未命名'); }
const openTodos = pid => state.todos.filter(t=>t.patientId===pid && !t.done).sort((a,b)=>b.createdAt-a.createdAt);
const openTodoAll = () => state.todos.filter(t=>{
  if(t.done) return false;
  const p = ptById(t.patientId);
  return !p || inCurDept(p);   // 患者已删除的待办保留；患者属于其他科室的隐藏
});
const examsOf = pid => state.exams.filter(x=>x.patientId===pid)
  .sort((a,b)=> (b.date||'').localeCompare(a.date||'') || b.createdAt-a.createdAt);

async function markChange(){
  state.meta.changes = (state.meta.changes||0) + 1;
  state.meta.autoBackup = JSON.stringify({patients:state.patients, todos:state.todos, exams:state.exams, notes:state.notes, plays:state.plays});
  state.meta.autoBackupAt = Date.now();
  await metaPut(state.meta);
}
async function loadAll(){
  state.patients = await txAll('patients');
  state.todos = await txAll('todos');
  state.exams = await txAll('exams');
  state.notes = await txAll('notes');
  state.plays = await txAll('plays').catch(()=>[]);
  state.meta = await metaGet();
}

/* ================= 锁屏 ================= */
const lock = { mode:'unlock' }; // unlock | setup
function showLock(){
  $('#lock').style.display='flex';
  if(state.meta.pinHash){ lock.mode='unlock'; $('#lock-title').textContent='输入 PIN 解锁';
    $('#lock-forgot').style.display=''; $('#lock-skip').style.display='none'; }
  else { lock.mode='setup'; $('#lock-title').textContent='设置 PIN（4–6 位数字）';
    $('#lock-forgot').style.display='none'; $('#lock-skip').style.display=''; }
  $('#lock-input').value=''; $('#lock-err').textContent='';
  setTimeout(()=>$('#lock-input').focus(), 100);
}
async function tryLock(){
  const v = $('#lock-input').value.trim();
  if(v.length<4){ $('#lock-err').textContent='至少 4 位'; return; }
  const h = cyrb53(v);
  if(lock.mode==='setup'){
    if(!lock.pending){ lock.pending=h; $('#lock-input').value=''; $('#lock-title').textContent='再输一遍确认';
      $('#lock-err').textContent=''; return; }
    if(lock.pending!==h){ lock.pending=null; $('#lock-input').value=''; $('#lock-title').textContent='两次不一致，重新设置 PIN';
      $('#lock-err').textContent=''; return; }
    state.meta.pinHash=h; state.meta.pinSkipped=false; await metaPut(state.meta); lock.pending=null;
  } else {
    if(state.meta.pinHash!==h){ $('#lock-err').textContent='PIN 不对'; $('#lock-input').value=''; return; }
  }
  sessionStorage.setItem('wardUnlocked','1');
  $('#lock').style.display='none';
  $('#app').classList.add('on');
  renderAll();
}
async function resetAll(){
  await txClear('patients'); await txClear('todos'); await txClear('exams'); await txClear('meta');
  state.patients=[]; state.todos=[]; state.exams=[]; state.meta={k:'main'};
  sessionStorage.removeItem('wardUnlocked');
  toast('已重置'); showLock();
}

/* ================= 渲染：病区 ================= */
function renderWard(){
  const pts = activePts(), outs = outPts();
  const nTodos = openTodoAll().length;
  let h = `<div class="quick-entrys">
    <button class="ent" id="ent-todos">✅ 待办${nTodos?` (${nTodos})`:''}</button>
    <button class="ent" id="ent-voice">🎙️ 语音</button>
    <button class="ent" id="ent-photo">📷 拍照</button>
    <button class="ent" id="ent-notes">💡 速记</button>

    h += `<div class="sect"><span>${curDept()?esc(curDept())+' · ':''}在院 ${pts.length} 人</span><span class="link" id="ward-dept">${curDept()?'切换科室':'设置科室'}</span></div>`;

  });

  const ev=$('#ent-voice'); if(ev) ev.onclick = ()=>{ if(!activePts().length) return toast('先在病区建患者'); voiceSheet(); };

function ptCard(p){
  const n = openTodos(p.id).length;
  const st = p.status==='在院' ? '' :
    `<span class="status-tag ${p.status==='已出院'?'out':'trans'}">${esc(p.status)}</span>`;
  return `<div class="card pt" data-id="${p.id}">
    <div class="bed"><div class="n">${esc(p.bed||'—')}</div><div class="t">床</div></div>
    <div class="mid">
      <div class="name">${esc(p.name||'未命名')}${st}</div>
      <div class="dx">${esc([p.diagnosis,p.surgery].filter(Boolean).join(' ｜ ')||'未填诊断')}</div>
      <div class="note">${esc(p.note||'')}</div>
    </div>
    ${n?`<span class="badge">${n}</span>`:''}
  </div>`;
}

/* ================= 渲染：待办 ================= */
function renderTodos(){
  const pts = activePts();
  const groups = pts.map(p=>({p, list:openTodos(p.id)})).filter(g=>g.list.length);
  let h = `<div class="quick">
    <select id="q-pt">${pts.map(p=>`<option value="${p.id}">${esc(ptName(p))}</option>`).join('')}</select>
    <input id="q-txt" placeholder="加待办，回车即存">
    <button class="btn" id="q-add">添加</button></div>
    <button class="btn ghost block" id="voice-entry" style="margin-bottom:14px">🎙️ 语音记录（录音 → 拆待办 / 整理病史）</button>`;
  if(!pts.length) h = `<div class="empty"><div class="big">📝</div>先在「病区」里建患者，才能加待办</div>`;
  if(!groups.length && pts.length) h += `<div class="empty">全病区待办已清空 ✓</div>`;
  for(const g of groups){
    h += `<div class="todo-group"><div class="g-head">${esc(ptName(g.p))}</div><div class="card" style="padding:2px 12px">` +
      g.list.map(t=>todoRow(t,false)).join('') + `</div></div>`;
  }
  const dones = state.todos.filter(t=>t.done).sort((a,b)=>b.doneAt-a.doneAt);
  if(dones.length){
    h += `<div class="sect"><span>已完成 ${dones.length}</span><span class="link" id="toggle-done">${state.showDone?'收起':'展开'}</span></div>`;
    if(state.showDone){
      h += `<div class="card" style="padding:2px 12px">` + dones.map(t=>todoRow(t,true)).join('') + `</div>`;
    }
  }
  $('#tp-body').innerHTML = h;
  bindTodoOps($('#tp-body'));
  const qAdd = $('#q-add');
  if(qAdd){
    const doAdd = async ()=>{
      const pid = $('#q-pt').value, txt = $('#q-txt').value.trim();
      if(!txt) return toast('先写内容');
      await addTodo(pid, txt);
      $('#q-txt').value=''; renderTodos();
    };
    qAdd.onclick = doAdd;
    $('#q-txt').onkeydown = e=>{ if(e.key==='Enter') doAdd(); };
  }
  const ve = $('#voice-entry'); if(ve) ve.onclick = voiceSheet;
  const td = $('#toggle-done'); if(td) td.onclick = ()=>{ state.showDone=!state.showDone; renderTodos(); };
}
function openTodosPage(){ renderTodos(); $('#todos-page').classList.add('on'); }

/* ---- 速记（科室心得） ---- */
function renderNotes(){
  const el = $('#np-body'); if(!el) return;
  const depts = [...new Set(state.notes.map(n=>n.dept||'未分科'))];
  let h = `<div class="quick" style="margin-top:10px">
    <select id="nt-type" style="flex:0 0 92px">
      <option value="note">心得</option>
      <option value="advice">指导意见</option>
    </select>
    <input id="nt-dept" list="dept-list" placeholder="科室" style="flex:0 0 92px" value="${esc(curDept()||state.lastDept||'')}">
    <datalist id="dept-list">${depts.map(d=>`<option value="${esc(d)}">`).join('')}</datalist>
    <input id="nt-txt" placeholder="一句心得、老师要点、查房指导意见…">
    <button class="btn" id="nt-add">记</button></div>
  <div class="quick" style="margin-top:6px">
    ${[['','全部'],['note','💡 心得'],['advice','🩺 指导意见']].map(([v,l])=>`<button class="btn sm ${state.noteFilter===v?'':'ghost'}" data-ntf="${v}" style="flex:1">${l}</button>`).join('')}
  </div>
  <button class="btn ghost block" id="nt-photo" style="margin-top:6px">📷 拍图记录（板书 / 幻灯 / 指南页，可 AI 整理）</button>
  <button class="btn ghost block" id="nt-export" style="margin-top:6px">📤 导出心得与指导意见（Word）</button>`;
  const filtered = state.notes.filter(n=>!state.noteFilter || (n.type||'note')===state.noteFilter);
  const fdepts = [...new Set(filtered.map(n=>n.dept||'未分科'))];
  if(!state.notes.length){
    h += `<div class="empty"><div class="big">💡</div>各科室的习惯、老师教的要点、查房的指导意见<br>随手一条，按类型和科室归档，备份一起带走</div>`;
  } else if(!filtered.length){
    h += `<div class="empty">这个类型下还没有记录</div>`;
  } else {
    for(const d of fdepts){
      const list = filtered.filter(n=>(n.dept||'未分科')===d).sort((a,b)=>b.createdAt-a.createdAt);
      h += `<div class="todo-group"><div class="g-head">${esc(d)} · ${list.length}</div><div class="card" style="padding:2px 12px">`+
        list.map(n=>`<div class="todo" data-id="${n.id}">
          <div class="txt"><div class="t1" style="white-space:pre-wrap">${n.type==='advice'?'<span style="background:#fbeeeb;color:var(--c-danger);font-size:11px;padding:1px 6px;border-radius:8px;margin-right:6px">指导意见</span>':''}${esc(n.text)}</div>${noteImgs(n).length?`<div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:6px">${noteImgs(n).map(b=>`<img src="${b}" style="height:64px;border-radius:8px">`).join('')}</div>`:''}<div class="t2">${noteTypeLabel(n.type)} · ${esc(md(isoToDate(n.createdAt)))}</div></div>
          <button class="del" data-op="del">✕</button></div>`).join('')+
        `</div></div>`;
    }
  }
  el.innerHTML = h;
  const add = async ()=>{
    const txt = $('#nt-txt').value.trim(); if(!txt) return toast('先写内容');
    const dept = $('#nt-dept').value.trim();
    const n = { id:uid(), dept, type:$('#nt-type').value, text:txt, createdAt:Date.now() };
    await txPut('notes', n); state.notes.push(n); state.lastDept = dept;
    await markChange(); renderNotes(); toast('已记下（'+noteTypeLabel(n.type)+'）');
  };
  $('#nt-add').onclick = add;
  $('#nt-txt').onkeydown = e=>{ if(e.key==='Enter') add(); };
  const np = $('#nt-photo'); if(np) np.onclick = noteImageSheet;
  const ne = $('#nt-export'); if(ne) ne.onclick = exportNotesSheet;
  el.querySelectorAll('[data-ntf]').forEach(b=>{
    b.onclick = ()=>{ state.noteFilter = b.dataset.ntf; renderNotes(); };
  });
  el.querySelectorAll('.todo .del').forEach(b=>{
    b.onclick = async ()=>{
      const id = b.closest('.todo').dataset.id;
      if(!await confirmBox('删除这条记录？')) return;
      await txDel('notes', id); state.notes = state.notes.filter(n=>n.id!==id);
      await markChange(); renderNotes();
    };
  });
}
function openNotesPage(){ renderNotes(); $('#notes-page').classList.add('on'); }
function todoRow(t, doneView){
  const p = ptById(t.patientId);
  const canArchive = !doneView && /检|MRI|CT|超声|血|造影|心电|镜|片|培养|穿刺|病理/.test(t.text||'');
  return `<div class="todo ${t.done?'done':''}" data-id="${t.id}">
    <button class="chk ${t.done?'on':''}" data-op="toggle">${t.done?'✓':''}</button>
    <div class="txt">
      <div class="t1">${esc(t.text)}</div>
      <div class="t2">${doneView
        ? `完成于 ${md(isoToDate(t.doneAt))}`
        : `${p&&p.status!=='在院'?esc(ptName(p))+' · ':''}${t.due?`<span class="due">${md(t.due)}前</span> `:''}${fmtCreated(t.createdAt)}`}</div>
    </div>
    ${canArchive?`<button class="arc" data-op="arc">→档</button>`:''}
    <button class="del" data-op="del">✕</button>
  </div>`;
}
const isoToDate = ts => { const d=new Date(ts); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); };
const fmtCreated = ts => { const d=isoToDate(ts); return d===today()?'今天建的':md(d)+'建的'; };
function refreshPBodyIfOpen(){
  if(state.cur && $('#ppage').classList.contains('on') && state.pTab==='ov') renderPBody();
}
function bindTodoOps(root){
  root.querySelectorAll('.todo').forEach(row=>{
    const id = row.dataset.id;
    row.querySelector('[data-op=toggle]').onclick = async ()=>{
      const t = state.todos.find(x=>x.id===id); if(!t) return;
      t.done = !t.done; t.doneAt = t.done ? Date.now() : null;
      await txPut('todos', t); await markChange(); renderAll(); refreshPBodyIfOpen();
    };
    const arc = row.querySelector('[data-op=arc]');
    if(arc) arc.onclick = ()=>{
      const t = state.todos.find(x=>x.id===id); if(!t) return;
      examSheet(t.patientId, { id:uid(), patientId:t.patientId, date:today(), title:t.text, findings:'', important:false, createdAt:Date.now() }, { fromTodo:t.id });
    };
    row.querySelector('[data-op=del]').onclick = async ()=>{
      const t = state.todos.find(x=>x.id===id); if(!t) return;
      if(!await confirmBox(`删除待办「${t.text.slice(0,20)}」？`)) return;
      await txDel('todos', id); await markChange(); renderAll(); refreshPBodyIfOpen(); toast('已删除');
    };
  });
}
async function addTodo(pid, text, due=''){
  const t = { id:uid(), patientId:pid, text, due, done:false, doneAt:null, createdAt:Date.now() };
  await txPut('todos', t); state.todos.push(t); await markChange();
}

/* --- 科室套路：科室特异的工作规矩，AI 整理/拆解时可选用作参考 --- */
const playTextOf = pid => (state.plays.find(x=>x.id===pid)||{}).text || '';
function playsSheet(){
  const depts = [...new Set(state.plays.map(p=>p.dept).filter(Boolean))];
  const groups = depts.map(d=>`<div style="margin-top:10px"><div style="font-size:13px;color:var(--c-sub);margin-bottom:4px">${esc(d)}</div>`
    + state.plays.filter(p=>p.dept===d).map(y=>`<div class="card" style="padding:8px 10px;margin-bottom:6px;display:flex;gap:8px;align-items:flex-start">
      <div style="flex:1;font-size:13px;white-space:pre-wrap">${esc(y.text.length>120?y.text.slice(0,120)+'…':y.text)}</div>

/* ================= 备份 ================= */
function buildBackup(){
  const m = state.meta;
  return { app:'ward-system', ver:4, exportedAt:new Date().toISOString(),
    patients:state.patients, todos:state.todos, exams:state.exams, notes:state.notes, plays:state.plays,
    /* AI 配置随备份走（key 出于安全不进备份，恢复后粘一次即可） */
    aiCfg: { prov:m.aiProv||null, base:m.aiBase||null, chat:m.aiModelChat||null, vision:m.aiModelVision||null, asr:m.aiModelAsr||null, asrUrl:m.aiAsrUrl||null },
    cfg: { curDept: curDept()||null } };
}
async function exportBackup(){
  try{
    const data = buildBackup();
    const d = new Date(); const stamp = d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0')+'-'+String(d.getHours()).padStart(2,'0')+String(d.getMinutes()).padStart(2,'0');
    const name = `海马备份-${stamp}.json`;
    const file = new File([JSON.stringify(data,null,2)], name, {type:'application/json'});
    if(navigator.canShare && navigator.canShare({files:[file]})){
      await navigator.share({ files:[file], title:'管床备份' });
    } else {
      const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'})); a.download=name; a.click();
      setTimeout(()=>URL.revokeObjectURL(a.href),5000);
    }
    state.meta.changes=0; state.meta.lastBackup=Date.now(); await metaPut(state.meta);
    toast('备份已导出');
  }catch(err){
    if(err && err.name==='AbortError') return;   // 用户取消分享不算失败
    toast('导出失败：'+err.message);
  }
}
function importBackup(){ $('#file-in').click(); }   // 仅打开文件选择框；处理器在 init 里绑一次
async function handleImportFile(e){
  {
    const f = e.target.files[0]; e.target.value='';
    if(!f) return;
    try{
      const data = JSON.parse(await f.text());
      if(data.app!=='ward-system') return toast('不是本系统的备份文件');
      if(!await confirmBox(`备份时间 ${data.exportedAt.slice(0,16).replace('T',' ')}\n患者 ${(data.patients||[]).length}、待办 ${(data.todos||[]).length}、检查 ${(data.exams||[]).length}、速记 ${(data.notes||[]).length}、套路 ${(data.plays||[]).length} 条。\n导入会【覆盖】手机当前全部数据，确定？`)) return;
      await txClear('patients'); await txClear('todos'); await txClear('exams'); await txClear('notes'); await txClear('plays');
      for(const p of data.patients||[]) await txPut('patients',p);
      for(const t of data.todos||[]) await txPut('todos',t);
      for(const x of data.exams||[]) await txPut('exams',x);
      for(const n of data.notes||[]) await txPut('notes',n);
      for(const y of data.plays||[]) await txPut('plays',y);
      await loadAll();
      if(data.aiCfg){   // 恢复 AI 配置（key 不在备份里，需重粘一次）
        const m = state.meta, c = data.aiCfg;
        m.aiProv = c.prov||null; m.aiBase = c.base||null;
        m.aiModelChat = c.chat||null; m.aiModelVision = c.vision||null;
        m.aiModelAsr = c.asr||null; m.aiAsrUrl = c.asrUrl||null;
        await metaPut(m);
      }
      if(data.cfg && data.cfg.curDept){   // 恢复当前科室
        state.meta.curDept = data.cfg.curDept; await metaPut(state.meta);
      }
      state.meta.changes=0; state.meta.autoBackup=JSON.stringify({patients:state.patients,todos:state.todos,exams:state.exams,notes:state.notes,plays:state.plays}); state.meta.autoBackupAt=Date.now();
      await metaPut(state.meta);
      renderAll(); toast('导入完成');
    }catch(err){ toast('导入失败：'+err.message); }
  }
}
async function restoreAuto(){
  const m = state.meta;
  if(!m.autoBackup) return toast('还没有自动备份');
  if(!await confirmBox(`恢复到 ${md(isoToDate(m.autoBackupAt))} 的手机内自动备份？\n会覆盖当前数据。`)) return;
  const data = JSON.parse(m.autoBackup);
  await txClear('patients'); await txClear('todos'); await txClear('exams'); await txClear('notes'); await txClear('plays');
  for(const p of data.patients||[]) await txPut('patients',p);
  for(const t of data.todos||[]) await txPut('todos',t);
  for(const x of data.exams||[]) await txPut('exams',x);
  for(const n of data.notes||[]) await txPut('notes',n);
  for(const y of data.plays||[]) await txPut('plays',y);
  await loadAll(); renderAll(); toast('已恢复');
}

/* ================= 导出数据查看版（Excel / Word，纯前端生成，不经网络） ================= */
function dataStamp(){
  const d = new Date();
  return d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0')+'-'+String(d.getHours()).padStart(2,'0')+String(d.getMinutes()).padStart(2,'0');
}
/* --- OneDrive 一键备份（电脑端 Chrome/Edge）：目录授权一次，之后一键写入网盘文件夹 --- */
async function odBackup(){
  let dir = state.meta.odHandle || null;
  if(dir){
    try{
      const perm = await dir.requestPermission({mode:'readwrite'});
      if(perm !== 'granted') dir = null;
    }catch(e){ dir = null; }
  }
  if(!dir){
    try{
      dir = await showDirectoryPicker({ mode:'readwrite' });
    }catch(e){
      if(e && e.name==='AbortError') return;   // 用户取消选择
      return toast('此环境不支持目录选择：'+(e&&e.message||e));
    }
  }
  try{
    const data = buildBackup();
    const name = '海马备份-'+dataStamp()+'.json';
    const fh = await dir.getFileHandle(name, {create:true});
    const w = await fh.createWritable();
    await w.write(JSON.stringify(data, null, 2));
    await w.close();
    state.meta.odHandle = dir;
    state.meta.changes = 0; state.meta.lastBackup = Date.now();
    await metaPut(state.meta);
    renderMore();
    toast('已备份到网盘目录（'+name+'）');
  }catch(err){
    toast('备份失败：'+(err&&err.message||err));
  }
}
function sortedPts(){
  return state.patients.slice().sort((a,b)=>
    ((parseFloat(a.bed)>=0?parseFloat(a.bed):1e9)-(parseFloat(b.bed)>=0?parseFloat(b.bed):1e9)) ||
    String(a.bed||'').localeCompare(String(b.bed||''),'zh') || String(a.name||'').localeCompare(String(b.name||''),'zh'));
}
const ptLabel = p => (p.bed? p.bed+'床':'') + (p.name? '·'+p.name : '');
async function shareFile(blob, name, okMsg){
  const file = new File([blob], name, {type: blob.type});
  if(navigator.canShare && navigator.canShare({files:[file]})){
    await navigator.share({files:[file], title:name});
  } else {
    const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href),5000);
  }
  toast(okMsg||'已导出');
}

/* --- Excel：SpreadsheetML 2003，Excel/WPS/Numbers 原生可开，零依赖 --- */
function xesc(s){
  return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/[\x00-\x08\x0b\x0c\x0e-\x1f]/g,'').replace(/\n/g,'&#10;');
}
function xlsTable(header, rows){
  const cell = (v,st)=> '<Cell'+(st?' ss:StyleID="'+st+'"':'')+'><Data ss:Type="String">'+xesc(v)+'</Data></Cell>';
  return '<Table><Row ss:StyleID="h">'+header.map(h=>cell(h,'h')).join('')+'</Row>'
    + rows.map(r=>'<Row>'+r.map(c=>cell(c)).join('')+'</Row>').join('') + '</Table>';
}
function buildExcelXml(){
  const ts = t => t? new Date(t).toLocaleString('zh-CN',{hour12:false}) : '';
  const HX = ['主诉','现病史','既往史','查体要点'];
  const shPts = xlsTable(
    ['床号','姓名','状态','入科日期','诊断','手术/计划','备注','出院/转科时间',...HX,'建档时间'],
    sortedPts().map(p=>{
      const h = p.history||{};
      return [String(p.bed||''), String(p.name||''), String(p.status||''), String(p.admission||''),
        String(p.diagnosis||''), String(p.surgery||''), String(p.note||''),
        p.dischargedAt? ts(p.dischargedAt):'', String(h.chief||''), String(h.present||''), String(h.past||''), String(h.exam||''), ts(p.createdAt)];
    }));
  const nameOf = id => { const p = state.patients.find(x=>x.id===id); return p? ptLabel(p):'(已删患者)'; };
  const shTodos = xlsTable(
    ['患者','待办','截止','状态','完成时间','创建时间'],
    state.todos.slice().sort((a,b)=> (a.done?1:0)-(b.done?1:0) || (a.due||'9999').localeCompare(b.due||'9999') || (a.createdAt||0)-(b.createdAt||0))
      .map(t=>[nameOf(t.patientId), String(t.text||''), String(t.due||''), t.done?'已完成':'未办', t.doneAt? ts(t.doneAt):'', ts(t.createdAt)]));
  const shExams = xlsTable(
    ['患者','日期','项目','关键结果与判读','重要'],
    state.exams.slice().sort((a,b)=> String(b.date||'').localeCompare(String(a.date||'')))
      .map(x=>[nameOf(x.patientId), String(x.date||''), String(x.title||''), String(x.findings||''), x.important?'★重要':'']));
  const shNotes = xlsTable(
    ['类型','科室','含图','内容','时间'],
    state.notes.slice().sort((a,b)=>(b.createdAt||0)-(a.createdAt||0))
      .map(n=>[noteTypeLabel(n.type), String(n.dept||''), noteImgs(n).length?('有图×'+noteImgs(n).length):'', String(n.text||''), ts(n.createdAt)]));
  return '<?xml version="1.0" encoding="UTF-8"?>\n<?mso-application progid="Excel.Sheet"?>\n'
    +'<Workbook xmlns="urn:schemas-microsoft-com:office:spreadsheet" xmlns:ss="urn:schemas-microsoft-com:office:spreadsheet">'
    +'<Styles><Style ss:ID="h"><Font ss:Bold="1" ss:Color="#FFFFFF"/><Interior ss:Color="#0A6E5C" ss:Pattern="Solid"/></Style></Styles>'
    +'<Worksheet ss:Name="患者">'+shPts+'</Worksheet>'
    +'<Worksheet ss:Name="待办">'+shTodos+'</Worksheet>'
    +'<Worksheet ss:Name="检验检查">'+shExams+'</Worksheet>'
    +'<Worksheet ss:Name="速记">'+shNotes+'</Worksheet>'
    +'</Workbook>';
}
function exportExcel(){
  const xml = buildExcelXml();
  shareFile(new Blob(['\ufeff'+xml], {type:'application/vnd.ms-excel'}), '海马数据-'+dataStamp()+'.xls', 'Excel 已生成');
}

/* Word 文档公共头（样式全平台通用）：全量导出与临床记录导出共用 */
const WORD_HEAD = `<head><meta charset="utf-8"><title>海马数据导出</title>
<!--[if gte mso 9]><xml><w:WordDocument><w:View>Print</w:View><w:Zoom>100</w:Zoom></w:WordDocument></xml><![endif]-->

function buildWordHtml(){
  const fd = s => { if(!s||!/^\d{4}-\d{2}-\d{2}$/.test(String(s))) return String(s||''); const [y,m,d]=String(s).split('-'); return y+'年'+parseInt(m)+'月'+parseInt(d)+'日'; };
  const fts = t => t? new Date(t).toLocaleString('zh-CN',{hour12:false}) : '';
  const pts = sortedPts();
  const body = pts.map(p=>{
    const h = p.history||{};
    const todos = state.todos.filter(t=>t.patientId===p.id);
    const open = todos.filter(t=>!t.done), done = todos.filter(t=>t.done);
    const exams = state.exams.filter(x=>x.patientId===p.id).sort((a,b)=>String(b.date||'').localeCompare(String(a.date||'')));
    const hxRow = (k,v)=> v? `<tr><th style="width:6em">${k}</th><td>${wesc(v).replace(/\n/g,'<br>')}</td></tr>`:'';
    return `<h2>${wesc(p.bed?p.bed+'床':'')}${wesc(p.name?' · '+p.name:'')}　<span class="sub">${wesc(p.status||'')}${p.dischargedAt?('（'+fd(fts(p.dischargedAt).slice(0,10).replace(/\//g,'-'))+'）'):''}</span></h2>
    <table><tr><th style="width:6em">入科日期</th><td>${fd(p.admission)}</td><th style="width:6em">诊断</th><td>${wesc(p.diagnosis||'')}</td></tr>
    ${p.surgery?`<tr><th>手术/计划</th><td colspan="3">${wesc(p.surgery)}</td></tr>`:''}
    ${p.note?`<tr><th>备注</th><td colspan="3">${wesc(p.note).replace(/\n/g,'<br>')}</td></tr>`:''}</table>
    ${(h.chief||h.present||h.past||h.exam)?`<h3>病史</h3><table>${hxRow('主诉',h.chief)}${hxRow('现病史',h.present)}${hxRow('既往史',h.past)}${hxRow('查体要点',h.exam)}</table>`:''}
    ${exams.length?`<h3>检验检查（新→旧）</h3><table><tr><th style="width:7em">日期</th><th style="width:9em">项目</th><th>关键结果与判读</th></tr>
      ${exams.map(x=>`<tr><td>${fd(x.date)}</td><td>${wesc(x.title)}${x.important?' <span class="imp">★</span>':''}</td><td>${wesc(x.findings).replace(/\n/g,'<br>')}</td></tr>`).join('')}</table>`:''}
    ${todos.length?`<h3>待办</h3>${open.length?`<p>${open.length} 条未办：</p><ul>${open.map(t=>`<li>${wesc(t.text)}${t.due?` <span class="imp">（${fd(t.due)}前）</span>`:''}</li>`).join('')}</ul>`:''}
      ${done.length?`<p class="sub">已完成 ${done.length} 条。</p>`:''}`:''}`;
  }).join('<br clear="all" style="page-break-before:always">');
  const notes = state.notes.slice().sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
  const noteSec = notes.length? `<br clear="all" style="page-break-before:always"><h1>速记 · 心得与指导意见</h1>` + notes.map(n=>
    `<p><b>${wesc(noteTypeLabel(n.type))} · ${wesc(n.dept||'未分科')}</b> <span class="sub">${fts(n.createdAt)}</span><br>${wesc(n.text).replace(/\n/g,'<br>')}${noteImgs(n).map(b=>`<br><img src="${b}" style="max-width:70%">`).join('')}</p>`).join('') : '';
  return `<!DOCTYPE html><html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40">
${WORD_HEAD}
<body><h1>海马 Hippocampus · 管床数据</h1><p class="sub">导出时间：${fts(Date.now())} · 患者 ${pts.length} 人（在院 ${pts.filter(p=>p.status==='在院').length}）· 本文件含真实诊疗信息，注意保管</p>${body}${noteSec}</body></html>`;
}
function exportWord(){
  const html = buildWordHtml();
  shareFile(new Blob([html], {type:'application/msword'}), '海马数据-'+dataStamp()+'.doc', 'Word 已生成');
}

      </div>`;

      if(p.status==='在院'){
        if(!await confirmBox(`${ptName(p)} 出院 / 转科归档？\n归档后从病区列表移入「已出院」，可恢复。`)) return;
        p.status = '已出院'; p.dischargedAt = Date.now();
      } else { p.status='在院'; p.dischargedAt=null; p.transDept=null; }
      await txPut('patients',p); await markChange(); renderAll(); openPatient(p.id);
    };
  }
  else if(state.pTab==='hx'){
    const rows = [['主诉','chief'],['现病史','present'],['既往史','past'],['查体要点','exam']];
    el.innerHTML = `
      <div class="sect"><span>病史</span><span class="link" id="hx-edit">编辑</span></div>
      ${rows.map(([k,f])=>`<div class="card"><div class="kv"><div class="k">${k}</div><div class="v">${p.history&&p.history[f]?esc(p.history[f]):'<span style="color:var(--c-sub)">（未填）</span>'}</div></div></div>`).join('')}`;
    $('#hx-edit').onclick = ()=>{
      const hh = p.history||{};
      sheet({ title:'编辑病史', okText:'保存',
        body:`<div class="form">
          <label>主诉</label><textarea id="hx-chief">${esc(hh.chief||'')}</textarea>
          <label>现病史</label><textarea id="hx-present" style="min-height:110px">${esc(hh.present||'')}</textarea>
          <label>既往史</label><textarea id="hx-past">${esc(hh.past||'')}</textarea>
          <label>查体要点</label><textarea id="hx-exam">${esc(hh.exam||'')}</textarea></div>`,
        onOk: async el=>{
          p.history = { chief:el.querySelector('#hx-chief').value.trim(),
            present:el.querySelector('#hx-present').value.trim(),
            past:el.querySelector('#hx-past').value.trim(),
            exam:el.querySelector('#hx-exam').value.trim() };
          await txPut('patients',p); await markChange(); renderPBody(); toast('病史已保存'); return true;
        }});
    };
  }
  else {
    const list = examsOf(p.id);
    el.innerHTML = `
      <div class="sect"><span>检验检查（新 → 旧，共 ${list.length} 条）</span></div>
      ${list.length?list.map(x=>`
        <div class="card exam-item ${x.important?'imp':''}">
          <div class="h"><span class="d">${esc(md(x.date))}</span><span class="t">${esc(x.title)}</span></div>
          ${x.findings?`<div class="f">${esc(x.findings)}</div>`:''}
          <div class="ops">
            <button class="imp ${x.important?'on':''}" data-op="imp">${x.important?'★ 重要（点击取消）':'☆ 标为重要'}</button>
            <button data-op="edit">改</button>
            <button data-op="del">删</button>
          </div>
        </div>`).join(''):`<div class="empty"><div class="big">🧪</div>结果回报后点右下角 ＋ 记一条</div>`}
      <button class="fab" id="exam-add">＋</button>`;
    $('#exam-add').onclick = ()=> examSheet(p.id);
    const items = el.querySelectorAll('.exam-item');
    list.forEach((x,i)=>{
      const item = items[i];
      item.querySelector('[data-op=imp]').onclick = async ()=>{
        x.important = !x.important; await txPut('exams',x); await markChange(); renderPBody();
      };
      item.querySelector('[data-op=del]').onclick = async ()=>{
        if(!await confirmBox(`删除「${x.title}」？`)) return;
        await txDel('exams',x.id); state.exams=state.exams.filter(e=>e.id!==x.id); await markChange(); renderPBody(); toast('已删除');
      };
      item.querySelector('[data-op=edit]').onclick = ()=> examSheet(p.id, x);
    });
  }
}
function examSheet(pid, exist, opts){
  opts = opts||{};
  const p = ptById(pid);
  sheet({ title: opts.fromTodo?'转档案 · 记录检验检查':(exist?'修改检查记录':'记录检验检查'), okText:'保存',
    body:`<div class="form">
      <label>日期</label><input type="date" id="ex-date" value="${exist?esc(exist.date):today()}">
      <label>项目（如：血常规 / 头颅 CT）</label><input id="ex-title" value="${exist?esc(exist.title):''}">
      <label>关键结果与判读</label><textarea id="ex-find" style="min-height:100px" placeholder="只记要点：异常值、结论、下一步">${exist?esc(exist.findings):''}</textarea>
      <div class="chkline"><input type="checkbox" id="ex-imp" ${exist&&exist.important?'checked':''}><label for="ex-imp" style="margin:0;color:var(--c-danger)">标为重要（危急值、需交代事项）</label></div></div>`,
    onOk: async el=>{
      const title = el.querySelector('#ex-title').value.trim();
      if(!title){ toast('项目名不能为空'); return false; }
      const rec = exist || { id:uid(), patientId:pid, createdAt:Date.now() };
      rec.date = el.querySelector('#ex-date').value || today();
      rec.title = title;
      rec.findings = el.querySelector('#ex-find').value.trim();
      rec.important = el.querySelector('#ex-imp').checked;
      await txPut('exams',rec);
      if(!state.exams.find(e=>e.id===rec.id)) state.exams.push(rec);
      if(opts.fromTodo){
        const t = state.todos.find(x=>x.id===opts.fromTodo);
        if(t && !t.done){ t.done = true; t.doneAt = Date.now(); await txPut('todos', t); }
      }
      await markChange(); renderPBody(); renderWard(); renderAll();
      toast(opts.fromTodo?'已建档，待办已勾掉':'已记录'); return true;
    }});
}

/* --- 图片临床记录：拍照/选图 → 可选 AI 整理 → 存为临床记录（图片随记录保存） --- */
function noteImageSheet(){
  let imgs = [];   // 压缩后的 dataURL 数组，支持多张
  const depts = [...new Set([...state.notes.map(n=>n.dept), ...state.patients.map(p=>p.dept)].filter(Boolean))];
  sheet({ title:'📷 图片临床记录', okText:'保存记录', body:`<div class="form">
      <div class="quick">
        <button class="btn ghost" id="ni-cam" style="flex:1">📷 拍照</button>
        <button class="btn ghost" id="ni-alb" style="flex:1">🖼️ 选图（可多张）</button>
      </div>
      <input type="file" id="ni-f1" accept="image/*" capture="environment" style="display:none">
      <input type="file" id="ni-f2" accept="image/*" multiple style="display:none">
      <div id="ni-prevs" style="display:flex;flex-wrap:wrap;gap:8px;margin-top:10px"></div>
      <button class="btn block" id="ni-run" style="display:none;margin-top:10px">🤖 AI 整理图片内容</button>
      <label style="margin-top:10px">记录内容（AI 整理结果或自己写的，可改）</label>
      <textarea id="ni-text" style="min-height:80px" placeholder="拍照/选图后点 AI 整理；也可以直接写"></textarea>
      <div class="quick" style="margin-top:8px">
        <select id="ni-type" style="flex:0 0 92px"><option value="note">心得</option><option value="advice">指导意见</option></select>
        <input id="ni-dept" list="ni-depts" placeholder="科室" style="flex:1" value="${esc(curDept()||state.lastDept||'')}">
        <datalist id="ni-depts">${depts.map(d=>`<option value="${esc(d)}">`).join('')}</datalist>
      </div>
      <div id="ni-err" style="color:var(--c-danger);font-size:13px;margin-top:8px;white-space:pre-wrap"></div>
      <div class="tip" style="margin-top:8px">可一次提交多张图（板书多页、多张报告单），AI 一起分析。图片压缩后随记录保存在本机、随备份带走；AI 整理失败也不影响直接保存。</div></div>`,
    onOk: async el=>{
      const text = el.querySelector('#ni-text').value.trim();
      if(!text && !imgs.length){ el.querySelector('#ni-err').textContent = '内容和图片至少要有一个'; return false; }
      const n = { id:uid(), dept: el.querySelector('#ni-dept').value.trim() || curDept() || '未分科',
        type: el.querySelector('#ni-type').value, text, imgs: imgs.length?imgs.slice():null, createdAt: Date.now() };
      await txPut('notes', n); state.notes.push(n); state.lastDept = n.dept;
      await markChange(); renderNotes(); toast('图片记录已保存（'+(imgs.length||0)+' 张图）'); return true;
    },
    onMount: el=>{
      const prevs = el.querySelector('#ni-prevs');
      const renderPrev = ()=>{
        prevs.innerHTML = imgs.map((b,i)=>`<div style="position:relative;flex:0 0 auto">
          <img src="${b}" style="height:76px;border-radius:8px;display:block">
          <button data-rm="${i}" style="position:absolute;top:-6px;right:-6px;width:20px;height:20px;border-radius:50%;border:none;background:#c0392b;color:#fff;font-size:11px;line-height:1">✕</button>
        </div>`).join('');
        prevs.style.display = imgs.length?'flex':'none';
        el.querySelector('#ni-run').style.display = imgs.length?'block':'none';
        prevs.querySelectorAll('[data-rm]').forEach(b=> b.onclick = ()=>{ imgs.splice(+b.dataset.rm,1); renderPrev(); });
      };
      const handle = async files=>{
        if(!files || !files.length) return;
        el.querySelector('#ni-err').textContent = '';
        for(const file of files){
          const blob = await compressImage(file, 1280, 0.75);
          imgs.push(await blobToDataURL(blob));
        }
        renderPrev();
      };
      el.querySelector('#ni-cam').onclick = ()=> el.querySelector('#ni-f1').click();
      el.querySelector('#ni-alb').onclick = ()=> el.querySelector('#ni-f2').click();
      el.querySelector('#ni-f1').onchange = e=> handle(e.target.files);
      el.querySelector('#ni-f2').onchange = e=> handle(e.target.files);
      el.querySelector('#ni-run').onclick = async ()=>{
        if(!imgs.length) return;
        const run = el.querySelector('#ni-run');
        run.textContent = 'AI 整理中（'+imgs.length+' 张图）…'; run.disabled = true;
        try{
          const content = imgs.map(b=>({type:'image_url', image_url:{url:b}}));
          content.push({type:'text', text:'以上是 '+imgs.length+' 张相关图片（板书/幻灯/指南页/报告单等），请综合全部图片提取临床要点，整理成一条简洁的中文记录，可分点。只输出整理后的文字本身，不要 JSON、不要评论。'});
          const out = await callChat([
            {role:'system', content:'你是临床记录助手。用户会给你一张或多张图片，提取与临床相关的文字要点，整理成一条简洁的中文记录，可分点。只输出整理后的文字本身，不要 JSON、不要评论。'},
            {role:'user', content}
          ], aiModels().vision, 0.2);
          el.querySelector('#ni-text').value = out.trim();
          run.textContent = '🤖 重新整理'; run.disabled = false;
        }catch(err){
          el.querySelector('#ni-err').textContent = 'AI 整理失败：'+err.message+'（图片已选好，也可以直接手写保存）';
          run.textContent = '🤖 AI 整理图片内容'; run.disabled = false;
        }
      };
      renderPrev();
    }});
}

/* --- 临床记录（心得/指导意见）专项导出：按类型与科室范围生成 Word --- */
function buildNotesWordDoc(typeF, deptF){
  const fts = t => t ? new Date(t).toLocaleString('zh-CN',{hour12:false}) : '';
  const list = state.notes
    .filter(n=>!typeF || (n.type||'note')===typeF)
    .filter(n=>!deptF || deptF==='__all' || (n.dept||'未分科')===deptF)
    .sort((a,b)=>(a.dept||'未分科').localeCompare(b.dept||'未分科','zh') || (b.createdAt||0)-(a.createdAt||0));
  const typeText = typeF ? noteTypeLabel(typeF) : '心得与指导意见';
  const deptText = (!deptF || deptF==='__all') ? '全部科室' : deptF;
  const groups = {};
  list.forEach(n=>{ const d = n.dept||'未分科'; (groups[d]=groups[d]||[]).push(n); });
  const body = Object.keys(groups).sort((a,b)=>a.localeCompare(b,'zh')).map(d=>
    `<h2>${wesc(d)} · ${groups[d].length} 条</h2>` + groups[d].map(n=>
      `<p><b>${wesc(noteTypeLabel(n.type))}</b> <span class="sub">${fts(n.createdAt)}</span><br>${wesc(n.text).replace(/\n/g,'<br>')}${noteImgs(n).map(b=>`<br><img src="${b}">`).join('')}</p>`).join('')).join('');
  return `<!DOCTYPE html><html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40">
${WORD_HEAD}
<body><h1>临床记录 · ${wesc(typeText)}</h1><p class="sub">范围：${wesc(deptText)} · 共 ${list.length} 条 · 导出时间：${fts(Date.now())} · 含真实临床信息，注意保管</p>${body}</body></html>`;
}
function exportNotesSheet(){
  if(!state.notes.length) return toast('还没有临床记录');
  const depts = [...new Set(state.notes.map(n=>n.dept||'未分科'))];
  sheet({ title:'📤 导出心得与指导意见', okText:'生成 Word',
    body:`<div class="form">
      <label>类型</label>
      <select id="exn-type">
        <option value="" ${state.noteFilter===''?'selected':''}>全部（心得+指导意见）</option>
        <option value="note" ${state.noteFilter==='note'?'selected':''}>心得</option>
        <option value="advice" ${state.noteFilter==='advice'?'selected':''}>指导意见</option>
      </select>
      <label>科室范围</label>
      <select id="exn-dept">
        <option value="__all">全部科室</option>
        ${depts.map(d=>`<option value="${esc(d)}" ${d===(curDept()||state.lastDept)?'selected':''}>${esc(d)}</option>`).join('')}
      </select>
      <div class="tip" style="margin-top:8px">生成后和备份一样经分享面板：存「文件」（→OneDrive/iCloud）或直接发微信。图片会嵌入文档。</div>
      <div id="exn-err" style="color:var(--c-danger);font-size:13px;margin-top:6px"></div></div>`,
    onOk: async el=>{
      const tf = el.querySelector('#exn-type').value;
      const df = el.querySelector('#exn-dept').value;
      const count = state.notes.filter(n=>(!tf||(n.type||'note')===tf)&&(!df||df==='__all'||(n.dept||'未分科')===df)).length;
      if(!count){ el.querySelector('#exn-err').textContent = '这个范围下没有记录'; return false; }
      const html = buildNotesWordDoc(tf, df);
      await shareFile(new Blob([html], {type:'application/msword'}), '临床记录-'+(tf?noteTypeLabel(tf):'全部')+'-'+dataStamp()+'.doc', 'Word 已生成');
      return true;
    }});
}

function patientSheet(existId, noteOnly){
  const p = existId ? ptById(existId) : null;
  sheet({ title: noteOnly?'编辑备注' : (p?'编辑患者信息':'新建患者'), okText:'保存',
    body:`<div class="form">

  document.body.append(mask, sh);

    mask.classList.remove('on'); sh.classList.remove('on'); setTimeout(()=>{mask.remove();sh.remove();},260); };

/* 浏览器端音频解码：任何浏览器能解的格式（含 iOS 的 m4a/aac）统一重采样为 16kHz 单声道 PCM */
async function decodePCM16k(blob){
  const ac = new (window.AudioContext||window.webkitAudioContext)();
  try{
    const buf = await ac.decodeAudioData(await blob.arrayBuffer());
    const oc = new OfflineAudioContext(1, Math.max(1, Math.ceil(buf.duration*16000)), 16000);
    const src = oc.createBufferSource(); src.buffer = buf; src.connect(oc.destination); src.start();
    const rend = await oc.startRendering();
    return rend.getChannelData(0);
  } finally { try{ ac.close(); }catch(e){} }
}
/* PCM 浮点数组 → WAV Blob（16kHz 单声道 16bit） */
function floatToWavBlob(d, rate){
  const wav = new ArrayBuffer(44 + d.length*2);
  const v = new DataView(wav);
  const ws = (o,s)=>{ for(let i=0;i<s.length;i++) v.setUint8(o+i, s.charCodeAt(i)); };
  ws(0,'RIFF'); v.setUint32(4, 36+d.length*2, true); ws(8,'WAVE'); ws(12,'fmt ');
  v.setUint32(16,16,true); v.setUint16(20,1,true); v.setUint16(22,1,true);
  v.setUint32(24,rate,true); v.setUint32(28,rate*2,true); v.setUint16(32,2,true); v.setUint16(34,16,true);
  ws(36,'data'); v.setUint32(40, d.length*2, true);
  for(let i=0;i<d.length;i++){ const s = Math.max(-1, Math.min(1, d[i])); v.setInt16(44+i*2, s<0 ? s*0x8000 : s*0x7FFF, true); }
  return new Blob([wav], {type:'audio/wav'});
}
async function blobToWav(blob){
  const d = await decodePCM16k(blob);
  return floatToWavBlob(d, 16000);
}
/* 导入的录音文件 → 自动分段转写拼接（转写接口限单条约 30 秒，长录音切 28 秒/段） */
async function transcribeFile(file, onProgress){
  let d;
  try{ d = await decodePCM16k(file); }
  catch(e){
    // 常见原因检测：ALAC（Apple 无损）m4a——Chromium 不支持解码
    let head = '';
    try{ head = new TextDecoder().decode(await file.slice(0, 200000).arrayBuffer()); }catch(_){}
    if(head.includes('alac')) throw new Error('这个录音是 Apple 无损格式（ALAC），浏览器解不了——请先转成 AAC/MP3 再导入（不会转就把文件发我）');
    throw new Error('无法解码这个音频文件（可能是格式不支持，试试转成 m4a/AAC/mp3）');
  }
  const SEG = 16000*28;
  const total = Math.max(1, Math.ceil(d.length/SEG));
  const texts = [];
  for(let i=0;i<total;i++){
    if(onProgress) onProgress(i+1, total);
    const seg = d.subarray(i*SEG, Math.min((i+1)*SEG, d.length));
    let txt = '';
    try{
      txt = await callAsr(floatToWavBlob(seg, 16000));
    }catch(e){
      if(i===0) throw e;
      throw new Error('第 '+(i+1)+'/'+total+' 段转写失败：'+e.message+'（前面 '+texts.length+' 段已转好，稍后重试会从头再来）');
    }
    if(txt) texts.push(txt);
    if(i<total-1) await new Promise(r=>setTimeout(r,400));   // 段间稍候，防限流
  }
  return texts.join(' ').replace(/\s+/g,' ').trim();
}
async function callAsr(blob){
  const m = aiModels();
  let up = blob;
  try{ up = await blobToWav(blob); }catch(e){ /* 解码失败则按原始格式上传 */ }
  return callAsrWav(up);
}
async function callAsrWav(wavBlob){
  const m = aiModels();
  const fd = new FormData();
  fd.append('file', new File([wavBlob], 'rec.wav', {type:'audio/wav'}));
  fd.append('model', m.asr);
  const r = await fetch(m.asrUrl, {method:'POST', headers:{'Authorization':'Bearer '+m.key}, body:fd});
  const data = await r.json().catch(()=>({}));
  if(!r.ok) throw new Error((data.error && data.error.message) || ('HTTP '+r.status));
  return data.text || (data.choices && data.choices[0] && data.choices[0].message && data.choices[0].message.content) || '';
}
function extractJSON(txt){
  const m = txt.match(/\{[\s\S]*\}|\[[\s\S]*\]/);
  if(!m) throw new Error('AI 未返回可解析的结果：'+String(txt).slice(0,100));
  return JSON.parse(m[0]);
}
function compressImage(file, maxSide, quality){
  maxSide = maxSide||1600; quality = quality||0.85;
  return new Promise((res,rej)=>{
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = ()=>{
      const sc = Math.min(1, maxSide/Math.max(img.width, img.height));
      const cv = document.createElement('canvas');
      cv.width = Math.round(img.width*sc); cv.height = Math.round(img.height*sc);
      cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
      URL.revokeObjectURL(url);
      cv.toBlob(b=> b?res(b):rej(new Error('图片处理失败')), 'image/jpeg', quality);
    };
    img.onerror = ()=>rej(new Error('图片读取失败'));
    img.src = url;
  });
}
const blobToDataURL = blob => new Promise((res,rej)=>{ const fr=new FileReader(); fr.onload=()=>res(fr.result); fr.onerror=rej; fr.readAsDataURL(blob); });

          <label>拆解待办指令</label>
          <textarea id="ai-p-todo" style="min-height:84px;font-size:12px" placeholder="${esc(AI_PROMPTS.todo)}">${esc((m.aiPrompts||{}).todo||'')}</textarea>
          <label>拍单识别指令</label>
          <textarea id="ai-p-exam" style="min-height:84px;font-size:12px" placeholder="${esc(AI_PROMPTS.exam)}">${esc((m.aiPrompts||{}).exam||'')}</textarea>
          <div class="tip" style="margin-top:6px">这里就是发给 AI 的原话，改了立即生效；清空内容恢复内置。注意：输出格式要求（JSON 字段名）别改，改了系统存不进去。语音整理病史用内置指令。科室套路在「📐 科室套路」里单独管理。</div>
        </div></details>
      <div id="ai-err" style="color:var(--c-danger);font-size:13px;margin-top:8px;white-space:pre-wrap"></div></div>`,
    onOk: async el=>{
      const getM = (sel,inp)=> sel.value==='__custom' ? inp.value.trim() : sel.value;
      const prov = el.querySelector('#ai-prov').value;
      if(!prov){ el.querySelector('#ai-err').textContent = '先选择服务商再保存'; return false; }
      const keyVal = el.querySelector('#ai-key').value.trim() || null;
      m.aiProv = prov;
      m.aiKeys = m.aiKeys || {};
      m.aiKeys[prov] = keyVal;      // 每个服务商各自一把
      m.aiKey = keyVal;             // 兼容字段=当前服务商的 key
      m.aiBase = el.querySelector('#ai-base').value.trim() || null;
      m.aiModelChat = getM(el.querySelector('#ai-mc-sel'), el.querySelector('#ai-mc')) || null;
      m.aiModelVision = getM(el.querySelector('#ai-mv-sel'), el.querySelector('#ai-mv')) || null;
      m.aiModelAsr = getM(el.querySelector('#ai-ma-sel'), el.querySelector('#ai-ma')) || null;
      m.aiAsrUrl = el.querySelector('#ai-au').value.trim() || null;
      m.aiPrompts = {
        hx: el.querySelector('#ai-p-hx').value.trim() || null,
        todo: el.querySelector('#ai-p-todo').value.trim() || null,
        exam: el.querySelector('#ai-p-exam').value.trim() || null,
      };
      await metaPut(m); renderMore(); toast('Provider 设置已保存'); return true;
    },
    onMount: el=>{
      const $ = id => el.querySelector(id.startsWith('#') ? id : '#'+id);
      const fillSel = (sel, list, cur) => {
        const opts = list.map(([v])=>`<option value="${esc(v)}">${esc(v)}</option>`).join('')
          + `<option value="__custom">✏️ 手动输入模型名…</option>`;
        sel.innerHTML = opts;
        if(cur && list.some(([v])=>v===cur)) sel.value = cur;
        else sel.value = '__custom';
      };
      const syncInput = (sel,inp)=>{
        if(sel.value==='__custom'){ inp.style.display='block'; if(!inp.value && sel.dataset.hint) inp.value = sel.dataset.hint; }
        else inp.style.display='none';
      };
      const applyProv = (pid, keepUserBase)=>{
        if(!pid){   // 未选择服务商：全部留空，等用户选
          $('ai-base').value = ''; $('ai-au').value = ''; $('ai-key').value = '';
          fillSel($('ai-mc-sel'), [], ''); fillSel($('ai-mv-sel'), [], ''); fillSel($('ai-ma-sel'), [], '');
          [['ai-mc-sel','ai-mc'],['ai-mv-sel','ai-mv'],['ai-ma-sel','ai-ma']].forEach(([s,i])=>syncInput($('#'+s), $('#'+i)));
          $('ai-prov-note').innerHTML = '📌 先在上方选择一个服务商（智谱 / 硅基流动 / DeepSeek / 自定义），地址和模型会自动带出。';
          return;
        }
        const pv = provById(pid) || AI_PROVIDERS[3];
        const sameProv = m.aiProv===pid;   // 仅当确实配置过该服务商时，才回显其已存模型
        if(!keepUserBase) $('ai-base').value = pv.base || '';
        $('ai-au').value = pv.asrUrl || '';
        $('ai-key').value = aiKeyFor(pid) || '';      // 每个服务商各自的 key
        fillSel($('ai-mc-sel'), pv.chat, sameProv ? m.aiModelChat : (pv.chat[0]&&pv.chat[0][0]));
        fillSel($('ai-mv-sel'), pv.vision, sameProv ? m.aiModelVision : (pv.vision[0]&&pv.vision[0][0]));
        fillSel($('ai-ma-sel'), pv.asr, sameProv ? m.aiModelAsr : (pv.asr[0]&&pv.asr[0][0]));
        [['ai-mc-sel','ai-mc'],['ai-mv-sel','ai-mv'],['ai-ma-sel','ai-ma']].forEach(([s,i])=>{
          const sel=$('#'+s), inp=$('#'+i);
          if(sel.value==='__custom' && !inp.value && sel.options.length>1){ sel.selectedIndex = 0; }
          syncInput(sel, inp);
        });
        $('ai-prov-note').innerHTML = pv.note ? '📌 '+esc(pv.note) : '智谱免费模型：文字 glm-4.5-flash、glm-4.7-flash；视觉 glm-4v-flash、glm-4.6v-flash。其余模型付费、按量计费（清单按官方文档 2026-10 核验）。';
      };
      // 首次打开：base/asrUrl 保留用户已存值；provider 用已存的
      applyProv(curProv, true);
      $('ai-prov').onchange = ()=> applyProv($('ai-prov').value, false);
      ['ai-mc-sel|ai-mc','ai-mv-sel|ai-mv','ai-ma-sel|ai-ma'].forEach(pair=>{
        const [s,i] = pair.split('|');
        $('#'+s).onchange = ()=> syncInput($('#'+s), $('#'+i));
      });
      $('ai-test').onclick = async ()=>{
        const key = $('ai-key').value.trim();
        const base = $('ai-base').value.trim() || AI_DEFAULTS.base;
        const mcSel=$('ai-mc-sel'), mcInp=$('ai-mc');
        const model = mcSel.value==='__custom' ? mcInp.value.trim() : mcSel.value;
        const out = $('ai-test-out');
        if(!key){ out.textContent = '先粘贴 API Key'; return; }
        if(!model){ out.textContent = '先选或填一个文字模型'; return; }
        const body = { model, messages:[{role:'user', content:'收到请只回复：连接成功'}], temperature:0.1 };
        const shownKey = key.length>14 ? key.slice(0,8)+'……'+key.slice(-4) : '***';
        const reqText = 'POST ' + base + '/chat/completions\nAuthorization: Bearer ' + shownKey + '\n' + JSON.stringify(body, null, 2);
        out.textContent = '请求中…\n—— 请求 ——\n' + reqText;
        const t0 = Date.now();
        try{
          const r = await fetch(base+'/chat/completions', {method:'POST', headers:{'Content-Type':'application/json','Authorization':'Bearer '+key}, body: JSON.stringify(body)});
          const txt = await r.text();
          let pretty = txt;
          try{ pretty = JSON.stringify(JSON.parse(txt), null, 2); }catch(e){}
          if(pretty.length > 2500) pretty = pretty.slice(0, 2500) + '\n…(过长截断)';
          out.textContent = 'HTTP ' + r.status + '（' + ((Date.now()-t0)/1000) + ' 秒）\n—— 请求 ——\n' + reqText + '\n—— 返回 ——\n' + pretty + (r.ok ? '\n✅ 连接正常' : '\n❌ 请求被拒绝：返回里的 error.message 就是具体原因');
        }catch(err){
          out.textContent = '—— 请求 ——\n' + reqText + '\n—— 请求未能发出 ——\n' + err.message + '\n（多为网络不通 / 接口地址写错 / 该平台不允许浏览器直连）';
        }
      };
    }});
}

function examAISheet(p){

          const j = extractJSON(out);
          closeSheet();
          examSheet(p.id, {
            id: uid(), patientId: p.id, createdAt: Date.now(),

            important: !!j.important,
          });
